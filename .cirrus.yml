env:
  ARBM_ZERO_SPEND_MODE: HARD

sweff_capacity_probe_task:
  only_if: $CIRRUS_BRANCH == "probe/sweff-cirrus-16g-20260906"
  timeout_in: 20m
  container:
    image: ubuntu:24.04
    cpu: 4
    memory: 16G
  verify_script:
    - set -euo pipefail
    - echo ZERO_SPEND_MODE=HARD
    - echo EXECUTION_POLICY=REMOTE_ONLY
    - echo LOCAL_HEAVY_ALLOWED=false
    - nproc
    - cat /proc/meminfo | grep MemTotal
    - test "$(nproc)" -ge 4
    - mem_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo); test "$mem_kb" -ge 16777216
    - echo SWEFF_CIRRUS_CAPACITY=PASS