version: 2.1
jobs:
  sovereign_oidc_probe:
    docker:
      - image: cimg/node:24.7
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate CircleCI OIDC claims without exposing token
          command: >-
            node -e "const token=process.env.CIRCLE_OIDC_TOKEN_V2||'';
            if(!token)throw new Error('CIRCLE_OIDC_TOKEN_V2_MISSING');
            const parts=token.split('.');if(parts.length!==3)throw new Error('OIDC_FORMAT');
            const raw=parts[1].replace(/-/g,'+').replace(/_/g,'/');
            const p=JSON.parse(Buffer.from(raw,'base64').toString('utf8'));
            const s={iss:p.iss,aud:p.aud,sub:p.sub,project_id:p['oidc.circleci.com/project-id'],org_id:p['oidc.circleci.com/org-id'],vcs_origin:p['oidc.circleci.com/vcs-origin'],vcs_ref:p['oidc.circleci.com/vcs-ref']};
            for(const [k,v] of Object.entries(s))if(v==null)throw new Error('MISSING_'+k);
            console.log('ARBM_CIRCLECI_OIDC_SAFE='+JSON.stringify(s));"
workflows:
  sovereign_oidc_probe:
    jobs:
      - sovereign_oidc_probe
