version: 2.1
jobs:
  sovereign_oidc_heartbeat:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Send authenticated sovereign heartbeat
          command: |
            test -n "$CIRCLE_OIDC_TOKEN_V2"
            body='{"action":"heartbeat","healthy":true,"zeroSpendVerified":true,"capabilities":["git","tests","build","cloud","docker","circleci-runner"],"detail":{"source":"circleci-native-oidc","remote_only":true}}'
            curl -fsS --retry 2 \
              -H "Authorization: Bearer $CIRCLE_OIDC_TOKEN_V2" \
              -H 'Content-Type: application/json' \
              -d "$body" \
              https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-continuity-coordinator-v1
workflows:
  sovereign_oidc_heartbeat:
    jobs:
      - sovereign_oidc_heartbeat
