version: 2.1
jobs:
  sovereign_oidc_heartbeat_claim:
    docker:
      - image: cimg/node:lts
    resource_class: small
    environment:
      ARBM_PROVIDER_ID: circleci-free-public
      ARBM_EXTRA_CAPABILITIES: circleci-runner
    steps:
      - checkout
      - run:
          name: Heartbeat and immediately claim mission
          command: |
            set -euo pipefail
            test -n "$CIRCLE_OIDC_TOKEN_V2"
            curl -fsS --retry 2 --max-time 15 \
              -H "Authorization: Bearer $CIRCLE_OIDC_TOKEN_V2" \
              -H 'content-type: application/json' \
              --data '{"action":"heartbeat","healthy":true,"zeroSpendVerified":true,"capabilities":["git","tests","build","cloud","circleci-runner"],"detail":{"source":"circleci-oidc-heartbeat","mode":"heartbeat-claim-same-job"}}' \
              https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-continuity-coordinator-v1
            ARBM_OIDC="$CIRCLE_OIDC_TOKEN_V2" ARBM_RUN_ROOT="$PWD/.arbm-run" node scripts/sovereign-continuity-worker.mjs

workflows:
  sovereign_active:
    jobs:
      - sovereign_oidc_heartbeat_claim:
          filters:
            branches:
              only: assist/circleci-sovereign-oidc-20260909

  sovereign_scheduled:
    triggers:
      - schedule:
          cron: "0,15,30,45 * * * *"
          filters:
            branches:
              only: assist/circleci-sovereign-oidc-20260909
    jobs:
      - sovereign_oidc_heartbeat_claim
