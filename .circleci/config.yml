version: 2.1
jobs:
  sweff_32g_probe:
    docker:
      - image: cimg/base:stable
    resource_class: 2xlarge
    steps:
      - setup_remote_docker
      - run:
          name: Prove SWEfficiency-compatible compute envelope
          command: |
            set -e
            echo ZERO_SPEND_MODE=HARD
            echo EXECUTION_POLICY=REMOTE_ONLY
            echo RESOURCE_CLASS=2xlarge
            nproc
            grep MemTotal /proc/meminfo
            docker version
            docker info
            docker run --rm --memory-reservation=16g --memory=32g alpine:3.22 true
            echo ARBM_CIRCLECI_SWEFF_32G_PROBE=PASS
workflows:
  sweff_32g_probe:
    jobs:
      - sweff_32g_probe:
          filters:
            branches:
              only: probe/circleci-32g-sweff-20260907
