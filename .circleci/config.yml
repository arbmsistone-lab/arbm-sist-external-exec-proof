version: 2.1
jobs:
  sovereign_oidc_probe:
    docker:
      - image: cimg/node:24.7
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate CircleCI OIDC claims without exposing token
          command: |
            node - <<'NODE'
            const token=process.env.CIRCLE_OIDC_TOKEN_V2||'';
            if(!token) throw new Error('CIRCLE_OIDC_TOKEN_V2_MISSING');
            const parts=token.split('.');
            if(parts.length!==3) throw new Error('OIDC_FORMAT');
            const raw=parts[1].replace(/-/g,'+').replace(/_/g,'/');
            const payload=JSON.parse(Buffer.from(raw,'base64').toString('utf8'));
            const safe={iss:payload.iss,aud:payload.aud,sub:payload.sub,
              project_id:payload['oidc.circleci.com/project-id'],
              org_id:payload['oidc.circleci.com/org-id'],
              vcs_origin:payload['oidc.circleci.com/vcs-origin'],
              vcs_ref:payload['oidc.circleci.com/vcs-ref']};
            for(const [k,v] of Object.entries(safe)) if(v==null) throw new Error(`MISSING_${k}`);
            console.log('ARBM_CIRCLECI_OIDC_SAFE='+JSON.stringify(safe));
            NODE
workflows:
  sovereign_oidc_probe:
    jobs:
      - sovereign_oidc_probe
