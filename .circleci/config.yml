version: 2.1
jobs:
  sovereign_oidc_heartbeat:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Send sovereign heartbeat via CircleCI OIDC
          command: |
            test -n "$CIRCLE_OIDC_TOKEN_V2"
            curl -fsS --retry 2 --max-time 15 \
              -H "Authorization: Bearer $CIRCLE_OIDC_TOKEN_V2" \
              -H 'content-type: application/json' \
              --data '{"action":"heartbeat","healthy":true,"zeroSpendVerified":true,"capabilities":["git","tests","build","cloud","circleci-runner"],"detail":{"source":"circleci-oidc-heartbeat","mode":"autonomous-continuity-worker"}}' \
              https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-continuity-coordinator-v1

  arbm_control_resilience_worker:
    docker:
      - image: cimg/node:24.8
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate ARBM CONTROL interruption resilience mission
          command: |
            set -euo pipefail
            test -n "$CIRCLE_OIDC_TOKEN_V2"
            node scripts/arbm-control-resilience-worker.mjs

  global_blocker_capacity_probe:
    machine:
      image: ubuntu-2404:current
    resource_class: 2xlarge
    steps:
      - checkout
      - run:
          name: Prove SWEfficiency host topology and Docker envelope
          command: |
            set -euo pipefail
            echo ZERO_SPEND_MODE=HARD
            echo HEAVY_LOCAL=0
            git init /tmp/sweff
            cd /tmp/sweff
            git remote add origin https://github.com/swefficiency/swefficiency.git
            git fetch --depth=1 origin 12d32a2d6800824a7d84bdb6797b5708e7b7957f
            git checkout --detach 12d32a2d6800824a7d84bdb6797b5708e7b7957f
            python3 -c "import importlib.util,json,os,pathlib; f='/tmp/sweff/swefficiency/harness/cpu_assignment.py'; spec=importlib.util.spec_from_file_location('sweff_cpu',f); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); physical=len(m.discover_physical_cores()); logical=len(os.sched_getaffinity(0)); eligible=max(0,physical-4); out={'logicalCpus':logical,'physicalCoresDiscovered':physical,'eligiblePhysicalCores':eligible,'requiredPhysicalCoresPerWorker':2,'cpuTopologyCompatible':eligible>=2}; pathlib.Path('/tmp/sweff-capacity.json').write_text(json.dumps(out,sort_keys=True)); print(json.dumps(out,sort_keys=True)); raise SystemExit(0 if out['cpuTopologyCompatible'] else 41)"
            id=$(docker create --memory-reservation=16g --memory=32g --memory-swap=32g --oom-kill-disable alpine:3.22 true)
            docker inspect "$id" --format '{{json .HostConfig}}' >/tmp/docker-hostconfig.json
            docker rm "$id"
            python3 -c "import json; d=json.load(open('/tmp/docker-hostconfig.json')); ok=(d['Memory']==34359738368 and d['MemoryReservation']==17179869184 and d['MemorySwap']==34359738368); print('SWEFF_DOCKER_MEMORY_ENVELOPE=' + ('PASS' if ok else 'FAIL')); raise SystemExit(0 if ok else 42)"
            echo SWEFFICIENCY_RESOURCE_CONTRACT=PASS

workflows:
  sovereign_oidc_heartbeat:
    triggers:
      - schedule:
          cron: "0,15,30,45 * * * *"
          filters:
            branches:
              only: assist/circleci-sovereign-oidc-20260909
    jobs:
      - sovereign_oidc_heartbeat
  arbm_control_resilience:
    jobs:
      - arbm_control_resilience_worker:
          filters:
            branches:
              only: master
  global_blocker_capacity:
    jobs:
      - global_blocker_capacity_probe:
          filters:
            branches:
              only: chatgpt/global-blockers-zero-spend-20260919
