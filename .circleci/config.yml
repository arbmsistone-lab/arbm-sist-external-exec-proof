version: 2.1
jobs:
  p2_heavy_zero_spend_proof:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: P2 third-domain heavy compute proof
          command: |
            set -euo pipefail
            echo "ARBM_P2_PROVIDER=CIRCLECI"
            echo "ARBM_P2_REMOTE_ONLY=PASS"
            echo "CPU_COUNT=$(nproc)"
            grep '^MemTotal:' /proc/meminfo
            END=$((SECONDS+20))
            for W in 1 2 3 4; do
              (while [ $SECONDS -lt $END ]; do head -c 16777216 /dev/zero | sha256sum >/dev/null; done) &
            done
            wait
            echo "ARBM_P2_HEAVY_COMPUTE=PASS"
            echo "WORKERS=4"
workflows:
  p2_third_domain:
    jobs:
      - p2_heavy_zero_spend_proof
