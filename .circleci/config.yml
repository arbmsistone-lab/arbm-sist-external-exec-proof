version: 2.1
jobs:
  sweff_32g_probe:
    docker:
      - image: cimg/base:stable
    resource_class: 2xlarge
    steps:
      - run:
          name: Isolate 32GB resource-class access
          command: |
            set -e
            echo ZERO_SPEND_MODE=HARD
            echo RESOURCE_CLASS=2xlarge
            nproc
            grep MemTotal /proc/meminfo
            echo ARBM_CIRCLECI_32G_CLASS_ACCESS=PASS
workflows:
  sweff_32g_probe:
    jobs:
      - sweff_32g_probe:
          filters:
            branches:
              only: probe/circleci-32g-sweff-20260907
