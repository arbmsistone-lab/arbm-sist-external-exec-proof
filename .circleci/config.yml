version: 2.1
jobs:
  p2_heavy_zero_spend_proof:
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: P2 third-domain heavy compute proof
          command: |
            set -euo pipefail
            echo "ARBM_P2_PROVIDER=CIRCLECI"
            echo "ARBM_P2_REMOTE_ONLY=PASS"
            echo "CPU_COUNT=$(nproc)"
            grep '^MemTotal:' /proc/meminfo
            python3 -c "import hashlib,multiprocessing as mp,os; f=lambda s: hashlib.sha256(((str(s)*1048576).encode()[:16777216])).hexdigest(); n=min(4,os.cpu_count() or 1); p=mp.Pool(n); out=p.map(f,range(n)); p.close(); p.join(); assert len(out)==n and all(len(x)==64 for x in out); print('ARBM_P2_HEAVY_COMPUTE=PASS'); print('WORKERS='+str(n))"
workflows:
  p2_third_domain:
    jobs:
      - p2_heavy_zero_spend_proof
