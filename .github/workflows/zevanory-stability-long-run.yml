name: zevanory-stability-long-run

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe OpenAI control plane IPv4
        shell: bash
        run: |
          set -euo pipefail
          curl -4 -o /dev/null -sS --max-time 15             -w 'family=4 dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code} remote=%{remote_ip}\n'             https://api.openai.com/
      - name: Probe OpenAI control plane IPv6
        shell: bash
        run: |
          set +e
          curl -6 -o /dev/null -sS --max-time 15             -w 'family=6 dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code} remote=%{remote_ip}\n'             https://api.openai.com/
          exit 0
      - name: Resolver and route evidence
        shell: bash
        run: |
          getent ahosts api.openai.com || true
          ip route || true
          ip -6 route || true
