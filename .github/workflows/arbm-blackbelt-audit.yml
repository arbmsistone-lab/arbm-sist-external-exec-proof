name: ARBM SIST Black Belt Audit

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact SHA to audit
        required: true
        default: 40043b5a3527eabecfde9944c1d0d60ae06e417a

permissions:
  contents: read

concurrency:
  group: arbm-blackbelt-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Validate requested SHA exists
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${{ inputs.baseline_sha }}^{commit}"

      - name: Run exhaustive static and runtime audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/arbm_blackbelt_audit.py \
            --sha "${{ inputs.baseline_sha }}" \
            --out-dir audit-out

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arbm-blackbelt-audit-${{ inputs.baseline_sha }}
          path: audit-out/
          if-no-files-found: error
          retention-days: 7
