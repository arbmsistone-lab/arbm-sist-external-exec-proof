name: HF Account Capability Probe
on:
  workflow_dispatch:
  push:
    branches: [codex/hf-capacity-probe-20260909]
permissions:
  contents: read
jobs:
  hf_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Fail closed without token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo '{"status":"NOT_CONFIGURED"}'; exit 1; }
      - name: Probe account safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request('https://huggingface.co/api/whoami-v2',headers={'Authorization':'Bearer '+os.environ['HF_TOKEN']})
          with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
          out={'status':'PASS','name':d.get('name'),'type':d.get('type'),'canPay':d.get('canPay'),'orgs':[{'name':x.get('name'),'roleInOrg':x.get('roleInOrg')} for x in d.get('orgs',[])]}
          print(json.dumps(out,separators=(',',':')))
          PY

