name: P9 Dubbo M003.1 Official Promotion Evaluation
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Evaluation request id
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ZERO_SPEND_MODE: HARD
      ARBM_ALLOW_LOCAL_AI: "0"
      DATA_COMMIT: 3500478e740d42583277c2658aa7729eb36e10f4
      TASK_ID: M003.1
      REPO_ID: apache_dubbo_dubbo-3.3.3_dubbo-3.3.6
      BENCHMARK_COMMIT: 6d8b31168fd0e2ad57c0d1daa3df1556df014320
      BENCHMARK_VERSION: v1.0.2
      SOLVE_RUN_ID: '34003310061'
      SOLVE_ARTIFACT: p9-dubbo-m0031-solve-arbm-p9-m0031-solve-20260905-07
      IMAGE_REF: hyd2apse/swe-milestone__apache_dubbo_dubbo-3.3.3_dubbo-3.3.6__m003.1@sha256:236a1ca0c7560850cca946886d77c64f24adb0c82913bd6299262add5475f5f2
      LOCAL_IMAGE: swe-milestone/apache_dubbo_dubbo-3.3.3_dubbo-3.3.6__m003.1:v1.0.2
      BASE_OFFLINE_REF: hyd2apse/swe-milestone__apache_dubbo_dubbo-3.3.3_dubbo-3.3.6__base-offline@sha256:f5c6fa1963515e4e04c9911c3df1979a920911ce9e7c19def9603a607a271dfe
      LOCAL_BASE_OFFLINE: swe-milestone/apache_dubbo_dubbo-3.3.3_dubbo-3.3.6__base-offline:v1.0.2
    steps:
      - uses: actions/checkout@v7
      - name: Verify free remote capacity
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPOSITORY_VISIBILITY" = public
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$ZERO_SPEND_MODE" = HARD
          test "$ARBM_ALLOW_LOCAL_AI" = 0
      - name: Verify independent result-gate rejection tests
        run: python -m unittest discover -s tests -p 'test_p9_promotion_gate.py'
      - name: Download frozen solve artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.SOLVE_ARTIFACT }}
          path: solve-artifact
          repository: arbmsistone-lab/arbm-sist-external-exec-proof
          run-id: ${{ env.SOLVE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify frozen solve identity
        shell: bash
        run: |
          set -euo pipefail
          test -s solve-artifact/solution.json
          test -s solve-artifact/solve-evidence.json
          python - <<'PY'
          import json
          s=json.load(open('solve-artifact/solution.json'))
          e=json.load(open('solve-artifact/solve-evidence.json'))
          assert s.get('github_run_id')=='34003310061'
          assert e.get('requestId')=='arbm-p9-m0031-solve-20260905-07'
          assert e.get('goldPatchExposed') is False
          assert e.get('mandatoryCostUsd')==0
          assert e.get('task')=='dubbo/M003.1'
          print('FROZEN_SOLVE_IDENTITY_PASS')
          PY
      - name: Fetch pinned harness and public evaluation data
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/DeepCommit-ai/SWE-Milestone.git harness-src
          git -C harness-src checkout "$BENCHMARK_COMMIT"
          mkdir -p "data/$REPO_ID/test_results/$TASK_ID" "data/$REPO_ID/dockerfiles/$TASK_ID" data/config
          base="https://huggingface.co/datasets/DeepCommit-ai/SWE-Milestone-data/resolve/$DATA_COMMIT"
          curl -fsSL --retry 4 -o "data/$REPO_ID/metadata.json" "$base/$REPO_ID/metadata.json?download=true"
          curl -fsSL --retry 4 -o "data/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_classification.json" "$base/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_classification.json?download=true"
          curl -fsSL --retry 4 -o "data/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_filter_list.json" "$base/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_filter_list.json?download=true"
          curl -fsSL --retry 4 -o "data/config/$REPO_ID.yaml" "$base/config/$REPO_ID.yaml?download=true"
          curl -fsSL --retry 4 -o "data/$REPO_ID/dockerfiles/evaluation_post_snapshot.sh" "https://huggingface.co/datasets/DeepCommit-ai/SWE-Milestone-data/resolve/$DATA_COMMIT/$REPO_ID/dockerfiles/evaluation_post_snapshot.sh?download=true"
          curl -fsSL --retry 4 -o "data/$REPO_ID/dockerfiles/$TASK_ID/test_config.json" "$base/$REPO_ID/dockerfiles/$TASK_ID/test_config.json?download=true"
          test -s "data/$REPO_ID/metadata.json"
          test -s "data/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_classification.json"
          test -s "data/config/$REPO_ID.yaml"
          test -s "data/$REPO_ID/dockerfiles/evaluation_post_snapshot.sh"
          test -s "data/$REPO_ID/dockerfiles/$TASK_ID/test_config.json"
          test "$(sha256sum "data/$REPO_ID/dockerfiles/$TASK_ID/test_config.json" | awk '{print $1}')" = "c8c792767923855a158fd1cd759553077bf7b4f71ec12e2939f213ba7ddb200c"
          test "$(sha256sum "data/$REPO_ID/dockerfiles/evaluation_post_snapshot.sh" | awk '{print $1}')" = "6869ee39355d4ddfca7dfb5bddf9f1b32e9651c94a31b522a8435d3810f2d099"
          chmod +x "data/$REPO_ID/dockerfiles/evaluation_post_snapshot.sh"
          sha256sum "data/$REPO_ID/metadata.json" "data/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_classification.json" "data/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_filter_list.json" "data/config/$REPO_ID.yaml" "data/$REPO_ID/dockerfiles/evaluation_post_snapshot.sh" "data/$REPO_ID/dockerfiles/$TASK_ID/test_config.json" > public-data-SHA256SUMS.txt
          python -m pip install -q -e ./harness-src
      - name: Bind verified CPU capacity and protected runtime
        shell: bash
        run: |
          set -euo pipefail
          python p9-promotion-bindings.py
      - name: Pull pinned official image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker tag "$IMAGE_REF" "$LOCAL_IMAGE"
          docker pull "$BASE_OFFLINE_REF"
          docker tag "$BASE_OFFLINE_REF" "$LOCAL_BASE_OFFLINE"
      - name: Recreate exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          docker create --name p9evalprep "$LOCAL_IMAGE" sleep infinity >/dev/null
          docker start p9evalprep >/dev/null
          docker exec p9evalprep bash -lc '/usr/local/bin/switch_state.sh start >/dev/null'
          docker exec p9evalprep bash -lc 'cd /testbed; git rev-parse HEAD' > start-commit.txt
          python - <<'PY'
          import json, pathlib, subprocess, tempfile
          sol=json.load(open('solve-artifact/solution.json'))
          ops=sol.get('operations') or []
          roots=('dubbo-plugin/dubbo-mutiny','dubbo-plugin/dubbo-compiler')
          assert 1 <= len(ops) <= 12
          root=pathlib.Path(tempfile.mkdtemp(prefix='p9frozen-'))
          def valid(p):
            p=str(p).replace('\\','/').removeprefix('./')
            assert p and not p.startswith('/') and '..' not in p.split('/')
            assert any(p==r or p.startswith(r+'/') for r in roots)
            return p
          for o in ops:
            p=valid(o['path']); kind=o['op']; new=str(o['new'])
            dst=root/p; dst.parent.mkdir(parents=True,exist_ok=True)
            if kind=='edit':
              subprocess.run(['docker','cp',f'p9evalprep:/testbed/{p}',str(dst)],check=True)
              lines=dst.read_text(encoding='utf-8').splitlines(True)
              a=int(o['start_line'])-1; b=int(o['end_line'])
              rep=new if new.endswith('\n') else new+'\n'
              lines[a:b]=[rep]
              dst.write_text(''.join(lines),encoding='utf-8')
            elif kind=='create':
              assert int(o['start_line'])==0 and int(o['end_line'])==0
              dst.write_text(new if new.endswith('\n') else new+'\n',encoding='utf-8')
            else:
              raise AssertionError('unsupported op')
            parent=str(pathlib.PurePosixPath(p).parent)
            subprocess.run(['docker','exec','p9evalprep','bash','-lc',f'mkdir -p -- /testbed/{parent}'],check=True)
            subprocess.run(['docker','cp',str(dst),f'p9evalprep:/testbed/{p}'],check=True)
          open('candidate-paths.txt','w').write('\n'.join(valid(o['path']) for o in ops)+'\n')
          PY
          docker exec p9evalprep bash -lc 'cd /testbed; git diff --check'
          test "$(wc -l < candidate-paths.txt)" -eq 1
          test "$(cat candidate-paths.txt)" = dubbo-plugin/dubbo-compiler/src/main/java/org/apache/dubbo/gen/tri/reactive/MutinyDubbo3TripleGenerator.java
          docker cp p9evalprep:/testbed/dubbo-plugin/dubbo-compiler/src/main/java/org/apache/dubbo/gen/tri/reactive/MutinyDubbo3TripleGenerator.java candidate.java
          echo '01293a340b468308c581168f7141e9e26df4d008963dd199ac271fde11ea0eb7  candidate.java' | sha256sum -c -
      - name: Build frozen candidate offline
        shell: bash
        run: |
          set -euo pipefail
          docker exec p9evalprep bash -lc '
            set -euo pipefail
            cd /testbed
            mvn -o -q -DskipTests spotless:check
            mvn -o -pl dubbo-plugin/dubbo-compiler,dubbo-plugin/dubbo-mutiny -am -DskipTests package
            git diff --check
          '
      - name: Create promotion source snapshot
        shell: bash
        run: |
          set -euo pipefail
          docker exec p9evalprep bash -lc 'cd /testbed; git ls-files -co --exclude-standard -z' > worktree-paths.z
          python - <<'PY'
          import hashlib,json,pathlib,sys,yaml
          sys.path.insert(0,'harness-src')
          from harness.e2e.evaluator import resolve_residue_prune_config
          from harness.utils.snapshot import should_include_snapshot_file
          repo='apache_dubbo_dubbo-3.3.3_dubbo-3.3.6'
          cfgp=pathlib.Path('data/config')/(repo+'.yaml')
          metap=pathlib.Path('data')/repo/'metadata.json'
          cfg_raw=cfgp.read_bytes(); cfg_sha=hashlib.sha256(cfg_raw).hexdigest()
          cfg=yaml.safe_load(cfg_raw) or {}; metadata=json.loads(metap.read_text())
          resolved=resolve_residue_prune_config(cfg,metadata,repo_config_binding_mode='trial-pinned',repo_config_sha256=cfg_sha)
          assert resolved.src_filter is not None
          raw=pathlib.Path('worktree-paths.z').read_bytes().split(b'\0')
          paths=[]
          for item in raw:
            if not item: continue
            path=item.decode('utf-8')
            if should_include_snapshot_file(path,resolved.src_filter,extra_build_manifests=set()):
              paths.append(path)
          paths=sorted(set(paths))
          assert paths and any(path.endswith('MutinyDubbo3TripleGenerator.java') for path in paths)
          pathlib.Path('snapshot-paths.z').write_bytes(b'\0'.join(path.encode() for path in paths)+b'\0')
          print('SNAPSHOT_PATHS',len(paths))
          PY
          docker exec -i p9evalprep tar -C /testbed -cf - --null -T - < snapshot-paths.z > source_snapshot.tar
          test -s source_snapshot.tar
          sha256sum source_snapshot.tar > source_snapshot.tar.sha256
      - name: Create pinned snapshot integrity sidecar
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e ./harness-src
          python - <<'PY'
          import hashlib,json,pathlib,sys,yaml
          sys.path.insert(0,'harness-src')
          from harness.e2e.evaluator import resolve_residue_prune_config
          from harness.e2e.residue_prune import capture_filter_config
          from harness.e2e.repo_config_binding import RepoConfigIdentity
          from harness.utils.snapshot import ManifestOverlay, make_snapshot_metadata
          repo='apache_dubbo_dubbo-3.3.3_dubbo-3.3.6'
          cfgp=pathlib.Path('data/config')/(repo+'.yaml')
          metap=pathlib.Path('data')/repo/'metadata.json'
          cfg_raw=cfgp.read_bytes(); cfg_sha=hashlib.sha256(cfg_raw).hexdigest()
          cfg=yaml.safe_load(cfg_raw) or {}; metadata=json.loads(metap.read_text())
          resolved=resolve_residue_prune_config(cfg,metadata,repo_config_binding_mode='trial-pinned',repo_config_sha256=cfg_sha)
          assert resolved.src_filter is not None
          start=pathlib.Path('start-commit.txt').read_text().strip()
          assert len(start) >= 40
          overlay=ManifestOverlay.create(start)
          data=make_snapshot_metadata(tag='agent-workdir-M003.1',snapshot_file=pathlib.Path('source_snapshot.tar'),manifest_overlay=overlay,extra={'ok':True,'capture_filter':capture_filter_config(resolved.src_filter),'repo_config_binding':RepoConfigIdentity(repo_name=repo,sha256=cfg_sha).to_dict(),'capture_mode':'frozen-solve-replay','gold_patch_exposed':False})
          pathlib.Path('source_snapshot.integrity.json').write_text(json.dumps(data,indent=2,sort_keys=True))
          print('SNAPSHOT_SIDECAR_PASS',data['snapshot_sha256'])
          PY
          test -s source_snapshot.integrity.json
      - name: Run official evaluator promotion
        shell: bash
        env:
          SWE_MILESTONE_IMAGE_TAG: v1.0.2
        run: |
          set -euo pipefail
          python -m pip install -q -e ./harness-src
          cfg="data/config/$REPO_ID.yaml"
          cfg_sha=$(sha256sum "$cfg" | awk '{print $1}')
          set +e
          python harness-src/harness/e2e/evaluator.py \
            --workspace-root "data/$REPO_ID" \
            --milestone-id "$TASK_ID" \
            --patch-file source_snapshot.tar \
            --baseline-classification "data/$REPO_ID/test_results/$TASK_ID/${TASK_ID}_classification.json" \
            --repo-config "$cfg" \
            --repo-config-sha256 "$cfg_sha" \
            --runtime-policy p9-bindings/runtime_policy.yaml \
            --runtime-policy-sha256 "$RUNTIME_POLICY_SHA256" \
            --runtime-policy-mode protected \
            --fail-closed-build-reports \
            --output evaluation_result.json 2>&1 | tee evaluator.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > eval-exit.txt
          test -s evaluation_result.json
      - name: Freeze promotion evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, runpy
          verify=runpy.run_path('p9-promotion-result-gate.py')['failures']
          p=pathlib.Path('evaluation_result.json')
          data=json.loads(p.read_text()) if p.exists() else {}
          summary={
            'schema':'arbm-p9-official-promotion-v1',
            'requestId':'${{ inputs.request_id }}',
            'solveRunId':34003310061,
            'task':'dubbo/M003.1',
            'benchmarkCommit':'6d8b31168fd0e2ad57c0d1daa3df1556df014320',
            'benchmarkVersion':'v1.0.2',
            'resolved':bool(data.get('resolved',False)),
            'legacySnapshot':bool((data.get('snapshot_integrity') or {}).get('legacy_unverified',False)),
            'promotionGrade':not verify(data),
            'patchSuccessfullyApplied':bool(data.get('patch_successfully_applied',False)),
            'snapshotIntegrityOk':(data.get('snapshot_integrity') or {}).get('ok'),
            'infraInvalid':bool(data.get('infra_invalid',False)),
            'evalStatus':data.get('eval_status'),
            'zeroSpendMode':'HARD',
          }
          pathlib.Path('promotion-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          PY
          sha256sum solve-artifact/solution.json solve-artifact/solve-evidence.json source_snapshot.tar public-data-SHA256SUMS.txt promotion-summary.json > evaluation-SHA256SUMS.txt
      - name: Upload promotion evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p9-dubbo-m0031-official-promotion-${{ inputs.request_id }}
          path: |
            evaluation_result.json
            evaluator.log
            candidate.java
            p9-bindings/
            solve-artifact/
            start-commit.txt
            candidate-paths.txt
            eval-exit.txt
            promotion-summary.json
            evaluation-SHA256SUMS.txt
            public-data-SHA256SUMS.txt
            source_snapshot.tar.sha256
            source_snapshot.integrity.json
          retention-days: 90
      - name: Cleanup
        if: always()
        shell: bash
        run: docker rm -f p9evalprep >/dev/null 2>&1 || true
      - name: Enforce promotion result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s eval-exit.txt
          rc=$(cat eval-exit.txt)
          echo "OFFICIAL_PROMOTION_EVALUATOR_RC=$rc"
          test "$rc" = "0"
          python p9-promotion-result-gate.py evaluation_result.json
