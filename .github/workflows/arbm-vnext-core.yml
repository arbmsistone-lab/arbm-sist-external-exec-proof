name: ARBM SIST vNEXT Core
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/arbm_core/**'
      - 'tests/arbm_core/**'
      - '.github/workflows/arbm-vnext-core.yml'
permissions:
  contents: read
jobs:
  vnext-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      ZERO_SPEND_MODE: HARD
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile vNEXT core
        run: python -m py_compile scripts/arbm_core/*.py tests/arbm_core/test_*.py
      - name: Run vNEXT contract suite
        run: python -m unittest discover -s tests/arbm_core -p 'test_*.py' -v