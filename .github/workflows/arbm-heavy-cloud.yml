name: ARBM Heavy Cloud Executor
on:
  workflow_dispatch:
    inputs:
      mission:
        description: Allowlisted heavy mission
        required: true
        type: choice
        options:
          - ripgrep-cargo-test
          - ripgrep-cargo-check
      request_id:
        description: ARBM request id
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate mission
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mission }}" in
            ripgrep-cargo-test|ripgrep-cargo-check) ;;
            *) echo 'MISSION_NOT_ALLOWLISTED'; exit 64 ;;
          esac
      - name: Pull and verify frozen SWE image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='swe-milestone/burntsushi_ripgrep_14.1.1_15.0.0__base-offline:v1.0.2'
          EXPECTED_ID='sha256:a22b225816bfc9fa243456a710bfc6e25ba6342c1162053a7876a73bfdec7e58'
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$EXPECTED_ID"
          test "$(docker run --rm --entrypoint sh "$IMAGE" -lc 'git -C /testbed rev-parse HEAD')" = 'd4b620ee55bcf3b2e85d23576878161540b67948'
      - name: Execute heavy mission
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='swe-milestone/burntsushi_ripgrep_14.1.1_15.0.0__base-offline:v1.0.2'
          if [ "${{ inputs.mission }}" = "ripgrep-cargo-test" ]; then
            docker run --rm --entrypoint sh "$IMAGE" -lc 'cd /testbed && CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1 cargo test --locked'
          else
            docker run --rm --entrypoint sh "$IMAGE" -lc 'cd /testbed && CARGO_BUILD_JOBS=2 cargo check --locked'
          fi
      - name: Emit evidence
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='swe-milestone/burntsushi_ripgrep_14.1.1_15.0.0__base-offline:v1.0.2'
          TARGET_SHA="$(docker run --rm --entrypoint sh "$IMAGE" -lc 'git -C /testbed rev-parse HEAD')"
          IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          printf '{"schema":"arbm-heavy-cloud-v1","requestId":"%s","mission":"%s","runner":"%s","targetSha":"%s","imageId":"%s","zeroSpendMode":"HARD","executionType":"remote","state":"SUCCEEDED"}\n' \
            "${{ inputs.request_id }}" "${{ inputs.mission }}" "$RUNNER_NAME" "$TARGET_SHA" "$IMAGE_ID" > evidence.json
          sha256sum evidence.json > evidence.sha256
          cat evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: arbm-heavy-cloud-${{ inputs.request_id }}
          path: |
            evidence.json
            evidence.sha256
          retention-days: 1
