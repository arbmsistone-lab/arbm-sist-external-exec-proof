name: ARBM Heavy Cloud Executor
on:
  workflow_dispatch:
    inputs:
      mission:
        description: Allowlisted heavy mission
        required: true
        type: choice
        options:
          - ripgrep-cargo-test
          - ripgrep-cargo-check
      request_id:
        description: ARBM request id
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate mission
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mission }}" in
            ripgrep-cargo-test|ripgrep-cargo-check) ;;
            *) echo 'MISSION_NOT_ALLOWLISTED'; exit 64 ;;
          esac
      - name: Checkout frozen public target
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/BurntSushi/ripgrep.git target
          git -C target checkout d4b620ee55bcf3b2e85d23576878161540b67948
          test "$(git -C target rev-parse HEAD)" = "d4b620ee55bcf3b2e85d23576878161540b67948"
      - name: Execute heavy mission
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=2
          if [ "${{ inputs.mission }}" = "ripgrep-cargo-test" ]; then
            cargo test --locked --manifest-path target/Cargo.toml
          else
            cargo check --locked --manifest-path target/Cargo.toml
          fi
      - name: Emit evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '{"schema":"arbm-heavy-cloud-v1","requestId":"%s","mission":"%s","runner":"%s","targetSha":"%s","zeroSpendMode":"HARD","executionType":"remote","state":"SUCCEEDED"}\n' \
            "${{ inputs.request_id }}" "${{ inputs.mission }}" "$RUNNER_NAME" "$(git -C target rev-parse HEAD)" > evidence.json
          sha256sum evidence.json > evidence.sha256
          cat evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: armb-heavy-cloud-${{ inputs.request_id }}
          path: |
            evidence.json
            evidence.sha256
          retention-days: 1
