name: ARBM Heavy Cloud Executor
on:
  workflow_dispatch:
    inputs:
      mission:
        description: Allowlisted heavy mission
        required: true
        type: choice
        options:
          - ripgrep-cargo-test
          - ripgrep-cargo-check
      request_id:
        description: ARBM request id
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate mission
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mission }}" in
            ripgrep-cargo-test|ripgrep-cargo-check) ;;
            *) echo 'MISSION_NOT_ALLOWLISTED'; exit 64 ;;
          esac
      - uses: actions/checkout@v7
      - name: Rebuild and verify frozen SWE baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 14.1.1 https://github.com/BurntSushi/ripgrep.git target
          test "$(git -C target rev-parse HEAD)" = '4649aa9700619f94cf9c66876e9549d83420e16c'
          git -C target apply --index ../ripgrep-rust2024.patch
          cp ripgrep-rust2024.patch target/rust2024_compat.patch
          git -C target add rust2024_compat.patch
          test "$(git -C target write-tree)" = 'ae9e34953dc822672095250a5f9a6045968f1358'
      - name: Execute heavy mission
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mission }}" = "ripgrep-cargo-test" ]; then
            (cd target && CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1 cargo test --locked)
          else
            (cd target && CARGO_BUILD_JOBS=2 cargo check --locked)
          fi
      - name: Emit evidence
        shell: bash
        run: |
          set -euo pipefail
          PARENT_SHA="$(git -C target rev-parse HEAD)"
          TREE_SHA="$(git -C target write-tree)"
          printf '{"schema":"arbm-heavy-cloud-v1","requestId":"%s","mission":"%s","runner":"%s","parentSha":"%s","treeSha":"%s","benchmarkBaselineCommit":"d4b620ee55bcf3b2e85d23576878161540b67948","zeroSpendMode":"HARD","executionType":"remote","state":"SUCCEEDED"}\n' \
            "${{ inputs.request_id }}" "${{ inputs.mission }}" "$RUNNER_NAME" "$PARENT_SHA" "$TREE_SHA" > evidence.json
          sha256sum evidence.json > evidence.sha256
          cat evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: arbm-heavy-cloud-${{ inputs.request_id }}
          path: |
            evidence.json
            evidence.sha256
          retention-days: 1
