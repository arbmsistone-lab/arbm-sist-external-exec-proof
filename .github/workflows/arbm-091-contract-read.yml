name: ARBM 091 Contract Read
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZERO_SPEND_MODE: HARD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch exact pinned Task 091 contract read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = HARD
          python -m pip install --disable-pip-version-check -q huggingface_hub==0.35.3
          python - <<'PY'
          import hashlib, os, pathlib
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(
              repo_id='xlangai/osworld_v2_tasks',
              repo_type='dataset',
              filename='task_091.py',
              revision='v2026.08.08',
              token=os.environ['HF_TOKEN'],
          )
          raw=pathlib.Path(p).read_bytes()
          out=pathlib.Path('task_091.py')
          out.write_bytes(raw)
          pathlib.Path('task_091.sha256').write_text(hashlib.sha256(raw).hexdigest()+'\n')
          print('TASK091_CONTRACT_BYTES='+str(len(raw)))
          print('TASK091_CONTRACT_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
      - name: Preserve exact contract source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task091-official-contract
          path: |
            task_091.py
            task_091.sha256
          if-no-files-found: error
          retention-days: 30
