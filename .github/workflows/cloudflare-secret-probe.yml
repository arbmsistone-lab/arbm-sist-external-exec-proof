name: Cloudflare secret route probe ZERO_SPEND
on:
  push:
    branches:
      - ops/cloudflare-secret-probe-20260922
    paths:
      - ".github/workflows/cloudflare-secret-probe.yml"

permissions:
  contents: read

jobs:
  credential-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S2: ${{ secrets.CF_API_TOKEN }}
      S3: ${{ secrets.CLOUDFLARE_TOKEN }}
    steps:
      - name: Prove credential presence
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${S1:-}" ] || [ -n "${S2:-}" ] || [ -n "${S3:-}" ]

  wrangler-auth:
    needs: credential-presence
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S2: ${{ secrets.CF_API_TOKEN }}
      S3: ${{ secrets.CLOUDFLARE_TOKEN }}
    steps:
      - name: Authenticate without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          token="${S1:-}"
          [ -n "$token" ] || token="${S2:-}"
          [ -n "$token" ] || token="${S3:-}"
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.135.0 whoami
