name: Coding Agent Index v1.4 Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Freeze benchmark repositories
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/datacurve-ai/deep-swe.git deep-swe
          git -C deep-swe checkout 0b9fabbb63b9104d678fe965e1632f2dd9eaa2ea
          git clone https://github.com/harbor-framework/terminal-bench-2-1.git terminal-bench
          git -C terminal-bench checkout 7131e4375048a0e408a8fb404b5f499d726b695b
          git clone https://github.com/EnvCommons/swe-atlas-qna.git swe-atlas
          git -C swe-atlas checkout 12dfc9ad64c5b397f0368bc9c3b9ef828956cbe7
      - name: Verify task counts and pins
        shell: bash
        run: python3 scripts/coding-agent-index-preflight.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-agent-index-v1-4-preflight
          path: coding-agent-index-preflight.json
