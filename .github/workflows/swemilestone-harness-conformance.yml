name: SWE-Milestone Harness Conformance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Constitutional contract
        run: |
          echo REMOTE_ONLY_FOR_HEAVY
          echo ZERO_SPEND_HARD
      - name: Fetch exact benchmark source
        run: |
          git clone --filter=blob:none https://github.com/DeepCommit-ai/SWE-Milestone.git src
          git -C src checkout 6d8b31168fd0e2ad57c0d1daa3df1556df014320
          test "$(git -C src rev-parse HEAD)" = "6d8b31168fd0e2ad57c0d1daa3df1556df014320"
      - name: Install exact harness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src[dev]'
      - name: Run full harness test suite
        id: tests
        continue-on-error: true
        run: |
          set +e
          cd src
          python -m pytest -q > ../pytest-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 ../pytest-output.txt
          exit 0
      - name: Freeze conformance verdict
        run: |
          python - <<'PY'
          import json, os, re
          text=open('pytest-output.txt',encoding='utf-8',errors='ignore').read()
          code=int('${{ steps.tests.outputs.exit_code }}')
          m=re.search(r'(\d+) passed', text)
          passed=int(m.group(1)) if m else 0
          summary={
            'schema':'arbm-swemilestone-harness-conformance-v1',
            'benchmark':'SWE-Milestone 1.0.2',
            'commit':'6d8b31168fd0e2ad57c0d1daa3df1556df014320',
            'pytestExitCode':code,
            'passedTests':passed,
            'harnessConformant':code==0,
            'completeFamilyCertified':False,
            'classification':'HARNESS_CONFORMANCE_PASS' if code==0 else 'HARNESS_CONFORMANCE_FAIL'
          }
          open('swemilestone-harness-summary.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY
          sha256sum swemilestone-harness-summary.json pytest-output.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: swemilestone-harness-conformance
          path: |
            swemilestone-harness-summary.json
            pytest-output.txt
            SHA256SUMS.txt
      - name: Conformance gate
        run: test '${{ steps.tests.outputs.exit_code }}' = '0'
