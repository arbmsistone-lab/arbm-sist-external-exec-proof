name: ARBM 091 semantic CoverStat recovery
on:
  pull_request:
    paths:
      - scripts/arbm091/semantic_runtime.py
      - tests/arbm091/test_semantic_runtime.py
      - .github/workflows/arbm-091-semantic-recovery.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      ZERO_SPEND_MODE: HARD
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install -r scripts/requirements-osworld.txt
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests/arbm091 -p 'test_*.py' -v
      - run: git diff --check
