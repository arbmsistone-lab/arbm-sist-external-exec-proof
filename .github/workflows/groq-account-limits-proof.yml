name: Groq Account Tier Readonly Proof
on:
  push:
    branches: ['codex/free-capacity-*']
    paths: ['.github/workflows/groq-account-limits-proof.yml']
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe paid-tier-only Batch listing without inference
        shell: bash
        run: |
          set -euo pipefail
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && SEP='&'
          R=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=arbm-sist-benchmark")
          T=$(python -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$R")
          O=$(curl -fsS -X POST -H "Authorization: Bearer $T" 'https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-cf-ai-probe-once-20260905')
          echo "$O"
          python -c 'import json,sys;d=json.load(sys.stdin);assert d.get("status")=="PASS_READONLY",d' <<<"$O"