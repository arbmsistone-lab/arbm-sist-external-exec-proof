name: ARBM 091 CoverStat recovery contract
on:
  pull_request:
    paths:
      - scripts/osworld_free_mesh_shim.py
      - tests/arbm091/test_score_and_trace.py
      - .github/workflows/arbm-091-cover-rewrite.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      ZERO_SPEND_MODE: HARD
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install -r scripts/requirements-osworld.txt
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m unittest discover -s tests/arbm091 -p 'test_*.py' -v
      - run: git diff --check
