name: ARBM Temporary Hash Lock Generator

on:
  push:
    branches:
      - chatgpt/arbm-world-free-assurance-20260920
    paths:
      - .github/workflows/arbm-lockfile-generator-temp.yml

permissions: read-all

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/arbm-world-free-assurance-20260920
          fetch-depth: 0
      - name: Install resolver from SHA256 lock
        run: python -m pip install --require-hashes -r audit/locks/uv-hf.txt
      - name: Generate remaining hashed locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/locks /tmp/arbm-lock-src

          cat > audit/locks/g3-openai-pillow11.in <<'EOF'
          openai>=1.50,<3
          Pillow==11.3.0
          PyYAML==6.0.2
          EOF
          uv pip compile --generate-hashes audit/locks/g3-openai-pillow11.in -o audit/locks/g3-openai-pillow11.txt

          cat > audit/locks/openai-only.in <<'EOF'
          openai>=1.50,<3
          EOF
          uv pip compile --generate-hashes audit/locks/openai-only.in -o audit/locks/openai-only.txt

          cat > audit/locks/huggingface-only.in <<'EOF'
          huggingface_hub==0.35.3
          EOF
          uv pip compile --generate-hashes audit/locks/huggingface-only.in -o audit/locks/huggingface-only.txt

          cat > audit/locks/pyyaml.in <<'EOF'
          PyYAML==6.0.2
          EOF
          uv pip compile --generate-hashes audit/locks/pyyaml.in -o audit/locks/pyyaml.txt

          git clone --filter=blob:none --no-checkout https://github.com/DeepCommit-ai/SWE-Milestone.git /tmp/arbm-lock-src/swe-milestone
          git -C /tmp/arbm-lock-src/swe-milestone checkout 6d8b31168fd0e2ad57c0d1daa3df1556df014320
          test "$(git -C /tmp/arbm-lock-src/swe-milestone rev-parse HEAD)" = 6d8b31168fd0e2ad57c0d1daa3df1556df014320
          uv pip compile --generate-hashes /tmp/arbm-lock-src/swe-milestone/pyproject.toml -o audit/locks/swe-milestone-base.txt
          uv pip compile --generate-hashes --extra dev /tmp/arbm-lock-src/swe-milestone/pyproject.toml -o audit/locks/swe-milestone-dev.txt

          git clone --filter=blob:none --no-checkout https://github.com/SWE-rebench/SWE-rebench-V2.git /tmp/arbm-lock-src/swe-rebench-v2
          git -C /tmp/arbm-lock-src/swe-rebench-v2 checkout c71902a8cf8d2b725f63d51f199f4d3e56f68d2d
          test "$(git -C /tmp/arbm-lock-src/swe-rebench-v2 rev-parse HEAD)" = c71902a8cf8d2b725f63d51f199f4d3e56f68d2d
          uv pip compile --generate-hashes /tmp/arbm-lock-src/swe-rebench-v2/requirements.txt -o audit/locks/swe-rebench-v2.txt
      - name: Commit generated locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name armb-lock-bot
          git config user.email armb-lock-bot@users.noreply.github.com
          git add audit/locks
          git diff --cached --quiet && exit 0
          git commit -m "security: add remaining SHA256 dependency locks"
          git push origin HEAD:chatgpt/arbm-world-free-assurance-20260920
