name: SWE-Milestone Promotion Binding Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promotion-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Constitutional contract
        run: |
          echo REMOTE_ONLY_FOR_HEAVY
          echo ZERO_SPEND_HARD
      - name: Fetch exact benchmark source
        run: |
          git clone --filter=blob:none https://github.com/DeepCommit-ai/SWE-Milestone.git src
          git -C src checkout 6d8b31168fd0e2ad57c0d1daa3df1556df014320
          python -m pip install -e ./src
      - name: Materialize exact benchmark data
        run: |
          git clone --depth 1 --branch v1.0.2 https://huggingface.co/datasets/DeepCommit-ai/SWE-Milestone-data data
          test "$(git -C data rev-parse HEAD)" = "3500478e740d42583277c2658aa7729eb36e10f4"
      - name: Freeze exact promotion bindings
        id: bind
        run: |
          set -euo pipefail
          repo='element-hq_element-web_v1.11.95_v1.11.97'
          ws="data/$repo"
          cls="$ws/test_results/feature_enhancements/feature_enhancements_classification.json"
          cfg="data/config/$repo.yaml"
          policy="src/quarantine_configs/$repo.yaml"
          test -f "$cls"; test -f "$cfg"; test -f "$policy"
          cfg_sha=$(sha256sum "$cfg" | awk '{print $1}')
          policy_sha=$(sha256sum "$policy" | awk '{print $1}')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "workspace=$ws" >> "$GITHUB_OUTPUT"
          echo "classification=$cls" >> "$GITHUB_OUTPUT"
          echo "repo_config=$cfg" >> "$GITHUB_OUTPUT"
          echo "repo_config_sha=$cfg_sha" >> "$GITHUB_OUTPUT"
          echo "runtime_policy=$policy" >> "$GITHUB_OUTPUT"
          echo "runtime_policy_sha=$policy_sha" >> "$GITHUB_OUTPUT"
      - name: Pull exact evaluator images by digest
        run: |
          set -euo pipefail
          feature_remote='hyd2apse/swe-milestone__element-hq_element-web_v1.11.95_v1.11.97__feature_enhancements@sha256:50bb079d4b9cc0b072f3957a7cdea81537f8b70fb06d941b4e1d9c92dea6bbef'
          feature_logical='swe-milestone/element-hq_element-web_v1.11.95_v1.11.97__feature_enhancements:v1.0.2'
          closure_remote='hyd2apse/swe-milestone__element-hq_element-web_v1.11.95_v1.11.97__base-offline@sha256:7c0367cc633fa0367368c358d245f379e2eef534f2360cf8296ec02d9ca18ce8'
          closure_logical='swe-milestone/element-hq_element-web_v1.11.95_v1.11.97__base-offline:v1.0.2'
          for pair in "$feature_remote|$feature_logical" "$closure_remote|$closure_logical"; do
            remote=${pair%%|*}
            logical=${pair#*|}
            docker pull "$remote"
            id=$(docker image inspect "$remote" --format '{{.Id}}')
            docker tag "$id" "$logical"
            test "$(docker image inspect "$logical" --format '{{.Id}}')" = "$id"
          done
      - name: Run promotion-grade evaluator binding probe
        id: eval
        continue-on-error: true
        env:
          WS: ${{ steps.bind.outputs.workspace }}
          CLS: ${{ steps.bind.outputs.classification }}
          CFG: ${{ steps.bind.outputs.repo_config }}
          CFG_SHA: ${{ steps.bind.outputs.repo_config_sha }}
          POLICY: ${{ steps.bind.outputs.runtime_policy }}
          POLICY_SHA: ${{ steps.bind.outputs.runtime_policy_sha }}
        run: |
          set +e
          : > empty.patch
          python -m harness.e2e.evaluator \
            --workspace-root "$WS" \
            --milestone-id feature_enhancements \
            --patch-file empty.patch \
            --baseline-classification "$CLS" \
            --repo-config "$CFG" \
            --repo-config-sha256 "$CFG_SHA" \
            --runtime-policy "$POLICY" \
            --runtime-policy-sha256 "$POLICY_SHA" \
            --runtime-policy-mode protected \
            --output evaluator-result.json \
            > evaluator-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 180 evaluator-output.txt
          exit 0
      - name: Freeze promotion diagnostic
        run: |
          python - <<'PY'
          import json, pathlib
          code=int('${{ steps.eval.outputs.exit_code }}')
          text=pathlib.Path('evaluator-output.txt').read_text(errors='ignore')
          summary={
            'schema':'arbm-swemilestone-promotion-binding-probe-v1',
            'benchmark':'SWE-Milestone 1.0.2',
            'repo':'element-web',
            'milestone':'feature_enhancements',
            'evaluatorExitCode':code,
            'resultFilePresent':pathlib.Path('evaluator-result.json').is_file(),
            'promotionBindingsPinned':True,
            'completeFamilyCertified':False,
            'classification':'PROMOTION_BINDING_PROBE_ONLY',
            'outputTail':text[-3500:]
          }
          pathlib.Path('promotion-binding-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - name: Freeze hashes
        run: |
          sha256sum promotion-binding-summary.json evaluator-output.txt > SHA256SUMS.txt
          if [ -f evaluator-result.json ]; then sha256sum evaluator-result.json >> SHA256SUMS.txt; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: swemilestone-promotion-binding-probe
          path: |
            promotion-binding-summary.json
            evaluator-output.txt
            evaluator-result.json
            SHA256SUMS.txt
