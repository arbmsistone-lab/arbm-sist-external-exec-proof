name: ARBM Provider Probe

on:
  push:
    branches:
      - 'p3/terminal-bench-*'
      - 'codex/free-capacity-*'
    paths:
      - 'arbm_provider_probe.py'
      - 'account_capacity_probe.py'
      - 'cerebras_capacity_probe.py'
      - 'test_cerebras_capacity_probe.py'
      - 'sambanova_capacity_probe.py'
      - 'distributed_capacity.py'
      - 'cloudflare_granite_capacity.py'
      - 'test_cloudflare_granite_capacity.py'
      - 'resilience_capacity.py'
      - 'test_resilience_capacity.py'
      - 'vikasit_capacity_probe.py'
      - 'test_vikasit_capacity_probe.py'
      - 'account-capacity-evidence.json'
      - 'test_provider_probe.py'
      - 'test_distributed_capacity.py'
      - 'mesh_capacity.py'
      - 'test_mesh_capacity.py'
      - 'test_mistral_mesh.mjs'
      - 'audit_30x10_capacity.py'
      - 'test_audit_30x10_capacity.py'
      - 'audit_50x10_capacity.py'
      - 'test_audit_50x10_capacity.py'
      - 'capacity_ceiling_gate.py'
      - 'test_capacity_ceiling_gate.py'
      - 'capacity_excellence.py'
      - 'test_capacity_excellence.py'
      - 'workload_useful_capacity.py'
      - 'test_workload_useful_capacity.py'
      - 'supabase/functions/arbm-terminal-agent-v7/**'
      - '.github/workflows/arbm-provider-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  provider_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERO_SPEND_MODE: HARD
    steps:
      - uses: actions/checkout@v7
      - name: Test proof gates and mesh regressions
        run: |
          python -m unittest test_provider_probe.py test_mesh_capacity.py test_distributed_capacity.py test_cloudflare_granite_capacity.py test_resilience_capacity.py test_vikasit_capacity_probe.py test_cerebras_capacity_probe.py test_capacity_excellence.py test_workload_useful_capacity.py test_audit_30x10_capacity.py test_audit_50x10_capacity.py test_capacity_ceiling_gate.py test_openrouter_capacity_probe.py
          python -m py_compile account_capacity_probe.py cerebras_capacity_probe.py sambanova_capacity_probe.py distributed_capacity.py cloudflare_granite_capacity.py resilience_capacity.py vikasit_capacity_probe.py capacity_excellence.py workload_useful_capacity.py audit_30x10_capacity.py audit_50x10_capacity.py capacity_ceiling_gate.py openrouter_capacity_probe.py groq_model_bucket_probe.py
          node --test test_mistral_mesh.mjs
          python - <<'PY'
          import json
          from mesh_capacity import certify_mesh
          d=json.load(open('account-capacity-evidence.json',encoding='utf-8'))
          r=certify_mesh(d['routes'])
          assert r['status']=='PASS', r
          assert r['certified_tokens_per_day']==8513773, r
          assert r['deficit_tokens_per_day']==0, r
          print(json.dumps(r,separators=(',',':')))
          PY
      - name: Report resilience and growth gates
        run: |
          python - <<'PY'
          import json
          from resilience_capacity import certify_resilience
          d=json.load(open('account-capacity-evidence.json',encoding='utf-8'))
          r=certify_resilience(d['routes'])
          assert r['base_3m_status']=='PASS', r
          print(json.dumps(r,separators=(',',':')))
          PY
      - name: Probe Vikasit Nova FREE capacity when configured
        env:
          VIKASIT_API_KEY: ${{ secrets.VIKASIT_API_KEY }}
        run: |
          python vikasit_capacity_probe.py
      - name: Probe Groq model-specific FREE buckets
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python groq_model_bucket_probe.py

      - name: Probe Mistral free moderation lane
        run: python mistral_free_moderation_probe.py
      - name: Probe ARBM FREE provider mesh
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python arbm_provider_probe.py
      - name: Probe account-bound FREE capacity
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python account_capacity_probe.py
      - name: Probe SambaNova recurring FREE capacity when configured
        env:
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python sambanova_capacity_probe.py
      - name: Probe OpenRouter FREE capacity when configured
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python openrouter_capacity_probe.py
      - name: Enforce current capacity configuration truth
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python capacity_configuration_gate.py

      - name: Probe Cerebras FREE capacity when configured
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python cerebras_capacity_probe.py
