name: ARBM Provider Probe

on:
  push:
    branches:
      - 'p3/terminal-bench-*'
      - 'codex/free-capacity-*'
    paths:
      - 'arbm_provider_probe.py'
      - '.github/workflows/arbm-provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  provider_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERO_SPEND_MODE: HARD
    steps:
      - uses: actions/checkout@v7
      - name: Probe ARBM FREE provider mesh
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python arbm_provider_probe.py
