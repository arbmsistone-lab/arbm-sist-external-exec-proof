name: ARBM Provider Probe

on:
  schedule:
    - cron: '17 11 * * *'
  push:
    branches:
      - 'p3/terminal-bench-*'
      - 'codex/free-capacity-*'
    paths:
      - 'arbm_provider_probe.py'
      - 'account_capacity_probe.py'
      - 'cerebras_capacity_probe.py'
      - 'test_cerebras_capacity_probe.py'
      - 'sambanova_capacity_probe.py'
      - 'distributed_capacity.py'
      - 'cloudflare_granite_capacity.py'
      - 'test_cloudflare_granite_capacity.py'
      - 'resilience_capacity.py'
      - 'test_resilience_capacity.py'
      - 'vikasit_capacity_probe.py'
      - 'test_vikasit_capacity_probe.py'
      - 'account-capacity-evidence.json'
      - 'test_provider_probe.py'
      - 'test_distributed_capacity.py'
      - 'mesh_capacity.py'
      - 'test_mesh_capacity.py'
      - 'test_mistral_mesh.mjs'
      - 'audit_30x10_capacity.py'
      - 'test_audit_30x10_capacity.py'
      - 'audit_50x10_capacity.py'
      - 'test_audit_50x10_capacity.py'
      - 'capacity_ceiling_gate.py'
      - 'test_capacity_ceiling_gate.py'
      - 'capacity_excellence.py'
      - 'adaptive_capacity_router.py'
      - 'test_adaptive_capacity_router.py'
      - 'capacity_revalidation_gate.py'
      - 'test_capacity_revalidation_gate.py'
      - 'capacity_contract_probe.py'
      - 'test_capacity_contract_probe.py'
      - 'live_capacity_survival_gate.py'
      - 'test_live_capacity_survival_gate.py'
      - 'supabase_guardrail_live_probe.py'
      - 'test_capacity_excellence.py'
      - 'workload_useful_capacity.py'
      - 'test_workload_useful_capacity.py'
      - 'gemini_account_quota_probe.py'
      - 'supabase/functions/arbm-terminal-agent-v7/**'
      - '.github/workflows/arbm-provider-probe.yml'
  pull_request:
    branches:
      - 'codex/free-capacity-account-proof-20260909'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  provider_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERO_SPEND_MODE: HARD
    steps:
      - uses: actions/checkout@v7
      - name: Test proof gates and mesh regressions
        run: |
          python -m unittest test_provider_probe.py test_mesh_capacity.py test_distributed_capacity.py test_cloudflare_granite_capacity.py test_resilience_capacity.py test_vikasit_capacity_probe.py test_cerebras_capacity_probe.py test_capacity_excellence.py test_workload_useful_capacity.py test_audit_30x10_capacity.py test_audit_50x10_capacity.py test_capacity_ceiling_gate.py test_openrouter_capacity_probe.py test_capacity_configuration_gate.py test_adaptive_capacity_router.py test_capacity_revalidation_gate.py test_capacity_contract_probe.py test_live_capacity_survival_gate.py test_sambanova_capacity_probe.py test_vercel_gateway_capacity_probe.py test_netlify_capacity_probe.py test_merge_live_capacity_evidence.py test_zero_capacity_pool_gate.py
          python -m py_compile account_capacity_probe.py cerebras_capacity_probe.py sambanova_capacity_probe.py distributed_capacity.py cloudflare_granite_capacity.py resilience_capacity.py vikasit_capacity_probe.py capacity_excellence.py workload_useful_capacity.py audit_30x10_capacity.py audit_50x10_capacity.py capacity_ceiling_gate.py openrouter_capacity_probe.py groq_model_bucket_probe.py vercel_gateway_capacity_probe.py netlify_capacity_probe.py capacity_configuration_gate.py adaptive_capacity_router.py capacity_revalidation_gate.py capacity_contract_probe.py supabase_guardrail_live_probe.py live_capacity_survival_gate.py merge_live_capacity_evidence.py gemini_account_quota_probe.py
          node --test test_mistral_mesh.mjs
          python - <<'PY'
          import json
          from mesh_capacity import certify_mesh
          d=json.load(open('account-capacity-evidence.json',encoding='utf-8'))
          r=certify_mesh(d['routes'])
          assert r['status']=='PASS', r
          assert r['certified_useful_units_per_day']==12917773, r
          assert r['certified_tokens_per_day']==8513773, r
          assert r['deficit_useful_units_per_day']==0, r
          assert r['independent_pools']==5, r
          print(json.dumps(r,separators=(',',':')))
          PY
      - name: Report resilience and growth gates
        run: |
          python - <<'PY'
          import json
          from resilience_capacity import certify_resilience
          d=json.load(open('account-capacity-evidence.json',encoding='utf-8'))
          r=certify_resilience(d['routes'])
          assert r['base_3m_status']=='PASS', r
          assert r['stretch_10m_status']=='PASS', r
          assert r['n_plus_one_3m_status']=='PASS', r
          from capacity_excellence import chaos_floors
          c=chaos_floors(d['routes']); assert c['n_plus_two_status']=='PASS', c
          assert c['n_plus_two_floor_useful_units_per_day']==5067741, c
          print(json.dumps({'resilience':r,'chaos':c},separators=(',',':')))
          PY
      - name: Probe Vikasit Nova FREE capacity when configured
        if: github.event_name != 'pull_request'
        env:
          VIKASIT_API_KEY: ${{ secrets.VIKASIT_API_KEY }}
        run: |
          python vikasit_capacity_probe.py
      - name: Prove Hugging Face account billing status
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf_account_status_probe.py | tee hf-account-status.json
      - name: Probe Hugging Face recurring FREE account envelope
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python huggingface_capacity_probe.py | tee hf-account-live.json
      - name: Probe Groq model-specific FREE buckets
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python groq_model_bucket_probe.py | tee groq-live.json

      - name: Probe Gemini account-bound quota metadata
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          python gemini_account_quota_probe.py | tee gemini-live.json

      - name: Probe Mistral free moderation lane
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          python mistral_free_moderation_probe.py | tee mistral-live.json
      - name: Probe Supabase FREE guardrail live
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          python supabase_guardrail_live_probe.py | tee supabase-live.json

      - name: Probe ARBM FREE provider mesh
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python arbm_provider_probe.py
      - name: Probe account-bound FREE capacity
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python account_capacity_probe.py | tee account-live.jsonl
      - name: Enforce live degraded-mode survival floor
        if: github.event_name != 'pull_request'
        run: |
          python live_capacity_survival_gate.py --account account-live.jsonl --mistral mistral-live.json --supabase supabase-live.json

      - name: Probe SambaNova recurring FREE capacity when configured
        if: github.event_name != 'pull_request'
        env:
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python sambanova_capacity_probe.py
      - name: Probe OpenRouter FREE capacity when configured
        if: github.event_name != 'pull_request'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python openrouter_capacity_probe.py
      - name: Revalidate public FREE contracts
        if: github.event_name != 'pull_request'
        run: python capacity_contract_probe.py

      - name: Enforce recurring FREE capacity revalidation
        if: github.event_name != 'pull_request'
        run: |
          python capacity_revalidation_gate.py --live-revalidated

      - name: PR deterministic certification gate
        if: github.event_name == 'pull_request'
        run: |
          test "$ZERO_SPEND_MODE" = "HARD"
          python capacity_configuration_gate.py
          python capacity_ceiling_gate.py

      - name: Enforce current capacity configuration truth
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python capacity_configuration_gate.py

      - name: Probe Cerebras FREE capacity when configured
        if: github.event_name != 'pull_request'
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = "HARD"
          python cerebras_capacity_probe.py
