name: P8 SWE-rebench V2 real smoke
on:
  workflow_dispatch:
  push:
    branches: ['p8/**']
    paths:
      - 'p8-swe-rebench-smoke.py'
      - '.github/workflows/p8-swe-rebench-smoke.yml'
permissions:
  contents: read
jobs:
  real-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Runner identity
        run: |
          uname -a
          free -m
          df -h .
          docker --version
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets
      - name: Build pinned llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git runtime
          git -C runtime checkout 159b741427337a2e9a58b08121001545d66b5825
          cmake -S runtime -B runtime/build -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/build -j2 --target llama-cli
          cp runtime/build/bin/llama-cli ./llama-cli
          ./llama-cli --version
      - name: Download audited Qwen 7B model remotely
        run: |
          curl -L --fail --retry 3 -o model.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf
          echo '509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c  model.gguf' | sha256sum -c -
      - name: Generate ARBM predicted patch
        env:
          LLAMA_CLI: ./llama-cli
          MODEL_PATH: model.gguf
          MODEL_LABEL: Qwen2.5-Coder-7B-Instruct-GGUF-Q4_K_M
        run: python p8-swe-rebench-smoke.py
      - name: Checkout frozen SWE-rebench V2 evaluator
        run: |
          git clone https://github.com/SWE-rebench/SWE-rebench-V2.git swe-rebench-v2
          git -C swe-rebench-v2 checkout c71902a8cf8d2b725f63d51f199f4d3e56f68d2d
          python -m pip install -r swe-rebench-v2/requirements.txt
      - name: Run official evaluator on first public sample task
        run: |
          python swe-rebench-v2/scripts/eval.py --hf-dataset ibragim-bad/SWE-rebench-V2-sample --hf-config default --hf-split train --hf-offset 0 --hf-length 1 --patches p8-swe-artifact/patches.json --max-workers 1 --report-json p8-swe-artifact/eval-report.json
      - name: Freeze hashes
        if: always()
        run: |
          sha256sum p8-swe-artifact/* > p8-swe-artifact/SHA256SUMS.txt || true
          cat p8-swe-artifact/SHA256SUMS.txt || true
      - name: Upload immutable smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p8-swe-rebench-v2-real-smoke
          path: p8-swe-artifact
          retention-days: 90
