name: Provider Candidate Evidence
on:
  pull_request:
    paths:
      - 'certification/provider-candidate-evidence.json'
      - 'certification/provider-candidate-evidence-check.mjs'
      - '.github/workflows/provider-candidate-evidence.yml'
  push:
    branches: [master]
    paths:
      - 'certification/provider-candidate-evidence.json'
      - 'certification/provider-candidate-evidence-check.mjs'
      - '.github/workflows/provider-candidate-evidence.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate fail-closed provider candidate registry
        run: node certification/provider-candidate-evidence-check.mjs
