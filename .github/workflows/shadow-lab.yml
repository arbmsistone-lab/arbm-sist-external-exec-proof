name: ARBM Shadow Lab External
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Audited model candidate
        required: true
        default: qwen7b-q4km
        type: choice
        options:
          - qwen7b-q4km
          - qwen14b-q3km
permissions:
  contents: read
jobs:
  shadow-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git runtime
          git -C runtime checkout 159b741427337a2e9a58b08121001545d66b5825
          cmake -S runtime -B runtime/build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build runtime/build -j2 --target llama-cli
      - name: Resolve audited candidate
        id: model
        shell: bash
        run: |
          case "${{ inputs.candidate }}" in
            qwen7b-q4km)
              echo "url=https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf" >> "$GITHUB_OUTPUT"
              echo "sha=509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c" >> "$GITHUB_OUTPUT"
              echo "label=Qwen2.5-Coder-7B-Instruct-GGUF-Q4_K_M" >> "$GITHUB_OUTPUT" ;;
            qwen14b-q3km)
              echo "url=https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/qwen2.5-coder-14b-instruct-q3_k_m.gguf" >> "$GITHUB_OUTPUT"
              echo "sha=93b69ebf2883dcd4d8fa0ebd4b4589ae0f3eedc721ac391a46d36d90762f4640" >> "$GITHUB_OUTPUT"
              echo "label=Qwen2.5-Coder-14B-Instruct-GGUF-Q3_K_M" >> "$GITHUB_OUTPUT" ;;
            *) exit 64 ;;
          esac
      - name: Download pinned official model
        run: |
          curl -L --fail --retry 3 -o model.gguf "${{ steps.model.outputs.url }}"
          echo "${{ steps.model.outputs.sha }}  model.gguf" | sha256sum -c -
      - name: Run shadow laboratory
        env:
          LLAMA_CLI: runtime/build/bin/llama-cli
          MODEL_PATH: model.gguf
          MODEL_LABEL: ${{ steps.model.outputs.label }}
        run: |
          set -o pipefail
          node shadow-lab.mjs | tee shadow-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: armb-shadow-lab-evidence
          path: shadow-evidence.json
