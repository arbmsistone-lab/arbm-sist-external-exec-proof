name: ZEVANORY AI3 FREE Proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zevanory-ai3-free-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'arbmsistone-lab/arbm-sist-external-exec-proof' && github.ref == 'refs/heads/g3-free-cert-lane-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GROQ_G3_FREE_CERT_KEY: ${{ secrets.GROQ_G3_FREE_CERT_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_MODEL: qwen/qwen3.8-27b
      OPENROUTER_MODEL: openrouter/free
    steps:
      - uses: actions/checkout@v4
      - name: Prove current FREE provider readiness
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          def call(url,key,payload):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json','User-Agent':'ZEVANORY-AI3-FREE/1.0'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=json.load(r)
                  assert r.status==200, body
                  return body
          groq_state='live'
          try:
              groq=call('https://api.groq.com/openai/v1/chat/completions',os.environ['GROQ_G3_FREE_CERT_KEY'],{
                  'model':os.environ['GROQ_MODEL'],'messages':[{'role':'user','content':'Reply with only READY.'}],
                  'temperature':0,'max_tokens':8})
              assert str(groq.get('choices',[{}])[0].get('message',{}).get('content','')).strip(), groq
          except urllib.error.HTTPError as e:
              if e.code!=429: raise
              groq_state='quota_limited'
              req=urllib.request.Request('https://api.groq.com/openai/v1/models',headers={'Authorization':'Bearer '+os.environ['GROQ_G3_FREE_CERT_KEY'],'Accept':'application/json','User-Agent':'ZEVANORY-AI3-FREE/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r: catalog=json.load(r)
              assert os.environ['GROQ_MODEL'] in {x.get('id') for x in catalog.get('data',[]) if isinstance(x,dict)}
              groq={'model':os.environ['GROQ_MODEL']}
          openrouter=call('https://openrouter.ai/api/v1/chat/completions',os.environ['OPENROUTER_API_KEY'],{
              'model':os.environ['OPENROUTER_MODEL'],
              'messages':[{'role':'system','content':'Return one strict JSON object only.'},{'role':'user','content':'Return {"action":"review","confidence":0.9}.'}],
              'response_format':{'type':'json_object'},'temperature':0,'max_tokens':64})
          content=str(openrouter.get('choices',[{}])[0].get('message',{}).get('content',''))
          parsed=json.loads(content)
          assert parsed.get('action')=='review', parsed
          cost=float((openrouter.get('usage') or {}).get('cost',-1))
          assert cost==0, {'unexpected_cost':cost}
          evidence={'state':'PASS','zero_spend':True,'paid_fallback_used':False,
                    'groq':{'authenticated':True,'model':groq.get('model'),'state':groq_state,'historical_zero_spend_proof_run':34383192307},
                    'openrouter':{'http':200,'requested_model':os.environ['OPENROUTER_MODEL'],'returned_model':openrouter.get('model'),'usage_cost_usd':cost,'structured_json':True}}
          open('zevanory-ai3-free-proof.json','w',encoding='utf-8').write(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence))
          PY
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevanory-ai3-free-proof
          path: zevanory-ai3-free-proof.json
          retention-days: 30
          if-no-files-found: warn
