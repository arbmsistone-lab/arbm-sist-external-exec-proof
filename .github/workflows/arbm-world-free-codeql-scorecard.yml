name: ARBM World Free CodeQL Scorecard

on:
  push:
    branches:
      - chatgpt/arbm-world-free-assurance-20260920
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  security-events: write
  statuses: read

jobs:
  scorecard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: Require maximum score
        shell: bash
        run: |
          python - <<'PY'
          import json
          data=json.load(open('scorecard.json'))
          score=float(data.get('score',0))
          print('OPENSSF_SCORECARD_SCORE=',score)
          if score < 10.0:
              raise SystemExit('OPENSSF_SCORECARD_NOT_MAXIMUM:'+str(score))
          PY
      - name: Upload Scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: world-free-scorecard
          path: scorecard.json
          if-no-files-found: error
          retention-days: 90

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          category: /language:${{ matrix.language }}

  verdict:
    if: always()
    needs: [scorecard, codeql]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          SCORECARD_RESULT: ${{ needs.scorecard.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$SCORECARD_RESULT" = success
          test "$CODEQL_RESULT" = success
          echo ARBM_WORLD_CODEQL_SCORECARD=PASS
