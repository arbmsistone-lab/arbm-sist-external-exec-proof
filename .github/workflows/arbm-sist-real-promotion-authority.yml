name: ARBM SIST Real Promotion Authority
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {required: true}
      baseline_sha: {required: true}
      constitutional_run_id: {required: true}
      adversarial_run_id: {required: true}
      witness_run_id: {required: true}
permissions:
  actions: read
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch exact run records and witness artifact
        env: {GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}"}
        run: |
          mkdir -p evidence/constitutional/runtime/witness
          for ID in "${{ inputs.constitutional_run_id }}" "${{ inputs.adversarial_run_id }}" "${{ inputs.witness_run_id }}"; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$ID" > "evidence/constitutional/runtime/run-$ID.json"
          done
          ART_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/${{ inputs.witness_run_id }}/artifacts" | python3 -c 'import json,sys; a=json.load(sys.stdin)["artifacts"]; print(a[0]["archive_download_url"] if len(a)==1 else "")')
          test -n "$ART_URL"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$ART_URL" -o /tmp/witness.zip
          python3 -m zipfile -e /tmp/witness.zip evidence/constitutional/runtime/witness
      - name: Build real-only manifest and decide
        run: |
          WITNESS=$(find evidence/constitutional/runtime/witness -name real-witnesses.json -print -quit)
          test -n "$WITNESS"
          python3 scripts/policy/build_final_real_manifest.py --candidate "${{ inputs.candidate_sha }}" --baseline "${{ inputs.baseline_sha }}" --constitutional-run "evidence/constitutional/runtime/run-${{ inputs.constitutional_run_id }}.json" --adversarial-run "evidence/constitutional/runtime/run-${{ inputs.adversarial_run_id }}.json" --witness-run "evidence/constitutional/runtime/run-${{ inputs.witness_run_id }}.json" --witness-json "$WITNESS" --out evidence/constitutional/promotion-evidence.json
          python3 scripts/policy/full_constitutional_gate.py --evidence evidence/constitutional/promotion-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: constitutional-real-promotion-${{ inputs.candidate_sha }}
          path: evidence/constitutional/
          retention-days: 30
