name: ARBM Top3 V3 Migration Load Failure Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres    steps:
      - uses: actions/checkout@v7
      - name: Run migration load and failure proof
        shell: bash
        run: bash scripts/top3-v3-migration-load-proof.sh
      - uses: actions/upload-artifact@v7
        with:
          name: top3-v3-migration-load-failure
          path: top3-v3-proof.json