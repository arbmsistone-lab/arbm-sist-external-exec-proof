name: ARBM External Execution Proof
on:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run deterministic mission
        run: node mission.mjs | tee evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: armb-external-proof
          path: evidence.json
