name: ARBM Top3 V3 Migration Load Failure Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Build 10k tenant baseline
        shell: bash
        run: |
          set -euo pipefail
          createdb v3test
          psql -d v3test -v ON_ERROR_STOP=1 <<'SQL'
          create schema ar_system;
          create table ar_system.jobs(tenant_id text not null,job_id bigint primary key,status text not null,payload jsonb not null default '{}'::jsonb);
          insert into ar_system.jobs select 'tenant-'||g,g,'queued',jsonb_build_object('n',g) from generate_series(1,10000) g;
          SQL      - name: Expand-contract canary and mixed-version proof
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" postgres:17 pg_dump -h 127.0.0.1 -U postgres -Fc -d v3test -f /work/pre-migration.dump
          psql -d v3test -v ON_ERROR_STOP=1 -c "alter table ar_system.jobs add column priority integer not null default 0"
          psql -d v3test -v ON_ERROR_STOP=1 -c "insert into ar_system.jobs(tenant_id,job_id,status,payload,priority) select 'canary-'||g,10000+g,'queued','{}',7 from generate_series(1,100) g"
          test "$(psql -d v3test -Atc "select count(*) from ar_system.jobs where priority=7")" = "100"
          psql -d v3test -v ON_ERROR_STOP=1 -c "insert into ar_system.jobs(tenant_id,job_id,status,payload) values('old-client',20001,'queued','{}')"
          psql -d v3test -v ON_ERROR_STOP=1 -c "insert into ar_system.jobs(tenant_id,job_id,status,payload,priority) values('new-client',20002,'queued','{}',9)"
          test "$(psql -d v3test -Atc "select count(*) from ar_system.jobs where job_id in (20001,20002)")" = "2"
      - name: Rollback restore proof
        shell: bash
        run: |
          set -euo pipefail
          createdb rollback_v3
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" postgres:17 pg_restore -h 127.0.0.1 -U postgres --exit-on-error -d rollback_v3 /work/pre-migration.dump
          test "$(psql -d rollback_v3 -Atc "select count(*) from ar_system.jobs")" = "10000"
          test "$(psql -d rollback_v3 -Atc "select count(*) from information_schema.columns where table_schema='ar_system' and table_name='jobs' and column_name='priority'")" = "0"      - name: 10k tenant concurrency load
        shell: bash
        run: |
          set -euo pipefail
          cat > bench.sql <<'EOF'
          \set tenant random(1,10000)
          select status from ar_system.jobs where job_id = :tenant;
          EOF
          docker run --rm --network host -e PGPASSWORD=postgres -v "$PWD:/work" postgres:17 pgbench -h 127.0.0.1 -U postgres -d v3test -n -c 32 -j 4 -t 313 -f /work/bench.sql | tee pgbench.txt
          grep -q 'number of failed transactions: 0' pgbench.txt
          grep -q 'tps = ' pgbench.txt
      - name: External failure injection
        shell: bash
        run: |
          set -euo pipefail
          test -f test_mesh_resilience.mjs
          node --test test_mesh_resilience.mjs | tee failure.txt
          grep -q '# fail 0' failure.txt
          grep -q 'N-1' failure.txt
      - name: Freeze evidence
        shell: bash
        run: |
          set -euo pipefail
          tps=$(awk '/^tps =/{print $3; exit}' pgbench.txt)
          latency=$(awk '/latency average =/{print $4; exit}' pgbench.txt)
          cat > top3-v3-proof.json <<EOF
          {"schema":"arbm-top3-v3-migration-load-failure-v1","result":"PASS","baseline_tenants":10000,"canary_rows":100,"mixed_version":true,"rollback_verified":true,"load_transactions":10016,"failed_transactions":0,"tps":${tps:-0},"latency_ms":${latency:-0},"failure_injection":"PASS","zero_spend_mode":"HARD"}
          EOF
          cat top3-v3-proof.json
      - uses: actions/upload-artifact@v7
        with:
          name: top3-v3-migration-load-failure
          path: top3-v3-proof.json