name: ARBM CONTROL SENIOR Performance Certification

on:
  push:
    branches:
      - feat/arbm-control-telemetry-cert-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run remote performance certification
        shell: bash
        env:
          BASE_URL: https://arbm-control-senior-d2xvhh.v2.appdeploy.ai
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, json, os, statistics, time, urllib.error, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          health=base + '/api/_healthcheck'
          dashboard=base + '/api/dashboard'
          def req(url, timeout=15):
              t=time.perf_counter()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ARBM-CONTROL-SENIOR-PERF','Cache-Control':'no-cache'}),timeout=timeout)
                  code=r.getcode(); r.read(512)
              except urllib.error.HTTPError as e:
                  code=e.code; e.read(512)
              return code,(time.perf_counter()-t)*1000
          first_code,first_ms=req(health)
          warm=[req(health) for _ in range(30)]
          lat=[ms for code,ms in warm if code==200]
          if len(lat)!=30: raise SystemExit('health_not_stable')
          def pct(xs,p):
              xs=sorted(xs); idx=max(0,min(len(xs)-1,int((p/100)*(len(xs)-1)+0.999999))); return xs[idx]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              conc=list(ex.map(lambda _: req(health), range(50)))
          conc_lat=[ms for code,ms in conc if code==200]
          if len(conc_lat)!=50: raise SystemExit('concurrency_health_failure')
          anon_code,anon_ms=req(dashboard)
          if anon_code not in (401,403): raise SystemExit(f'protected_route_not_denied:{anon_code}')
          bad_code,bad_ms=req(base + '/api/__forced_missing_route__')
          recovery_code,recovery_ms=req(health)
          if recovery_code!=200: raise SystemExit('health_did_not_recover_after_negative_probe')
          report={
            'schema':'arbm-control-senior-performance-v1',
            'target':base,
            'first_request_ms':round(first_ms,2),
            'first_request_status':first_code,
            'warm':{'n':len(lat),'p50_ms':round(pct(lat,50),2),'p95_ms':round(pct(lat,95),2),'p99_ms':round(pct(lat,99),2),'max_ms':round(max(lat),2)},
            'concurrency':{'requests':50,'workers':10,'success':len(conc_lat),'p50_ms':round(pct(conc_lat,50),2),'p95_ms':round(pct(conc_lat,95),2),'p99_ms':round(pct(conc_lat,99),2),'max_ms':round(max(conc_lat),2)},
            'security_guard':{'anonymous_dashboard_status':anon_code,'latency_ms':round(anon_ms,2)},
            'recovery_probe':{'negative_status':bad_code,'negative_latency_ms':round(bad_ms,2),'post_probe_health_status':recovery_code,'post_probe_health_ms':round(recovery_ms,2)},
            'cold_start_certified':False,
            'cold_start_note':'First request measured from fresh client process; platform instance coldness cannot be proven without provider lifecycle control.'
          }
          os.makedirs('evidence/arbm-control-senior-performance',exist_ok=True)
          with open('evidence/arbm-control-senior-performance/report.json','w') as f: json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arbm-control-senior-performance-${{ github.run_id }}
          path: evidence/arbm-control-senior-performance
          if-no-files-found: error
          retention-days: 7
