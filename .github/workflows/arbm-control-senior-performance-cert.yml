name: ARBM CONTROL SENIOR Performance Certification

on:
  push:
    branches:
      - feat/arbm-control-telemetry-cert-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run remote performance certification
        shell: bash
        env:
          APP_URL: https://arbm-control-senior-d2xvhh.v2.appdeploy.ai
          WORKER_URL: https://arbm-control.zevanory.workers.dev
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, json, os, time, urllib.error, urllib.request
          app=os.environ['APP_URL'].rstrip('/')
          worker=os.environ['WORKER_URL'].rstrip('/')
          def req(url, timeout=15):
              t=time.perf_counter()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ARBM-CONTROL-SENIOR-PERF','Cache-Control':'no-cache'}),timeout=timeout)
                  code=r.getcode(); body=r.read(2048)
              except urllib.error.HTTPError as e:
                  code=e.code; body=e.read(2048)
              return code,(time.perf_counter()-t)*1000,body
          def pct(xs,p):
              xs=sorted(xs); idx=max(0,min(len(xs)-1,int((p/100)*(len(xs)-1)+0.999999))); return xs[idx]
          targets={
            'app_health': app + '/api/_healthcheck',
            'worker_health': worker + '/health'
          }
          report={'schema':'arbm-control-senior-performance-v2','targets':{},'cold_start_certified':False,'cold_start_note':'First request is measured from a fresh client process only; provider instance coldness is not asserted.'}
          for name,url in targets.items():
              first_code,first_ms,_=req(url)
              if first_code!=200: raise SystemExit(f'{name}_first_status:{first_code}')
              warm=[req(url) for _ in range(30)]
              lat=[ms for code,ms,_ in warm if code==200]
              if len(lat)!=30: raise SystemExit(f'{name}_warm_instability')
              with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
                  conc=list(ex.map(lambda _: req(url), range(50)))
              clat=[ms for code,ms,_ in conc if code==200]
              if len(clat)!=50: raise SystemExit(f'{name}_concurrency_failure')
              report['targets'][name]={
                'first_request_ms':round(first_ms,2),
                'warm':{'n':30,'p50_ms':round(pct(lat,50),2),'p95_ms':round(pct(lat,95),2),'p99_ms':round(pct(lat,99),2),'max_ms':round(max(lat),2)},
                'concurrency':{'requests':50,'workers':10,'success':50,'p50_ms':round(pct(clat,50),2),'p95_ms':round(pct(clat,95),2),'p99_ms':round(pct(clat,99),2),'max_ms':round(max(clat),2)}
              }
          unauth_code,unauth_ms,_=req(worker + '/telemetry/v1')
          if unauth_code!=401: raise SystemExit(f'worker_fail_closed_expected_401_got:{unauth_code}')
          rec_code,rec_ms,_=req(worker + '/health')
          if rec_code!=200: raise SystemExit('worker_health_not_recovered')
          report['security_guard']={'telemetry_without_token_status':unauth_code,'latency_ms':round(unauth_ms,2)}
          report['recovery_probe']={'post_negative_health_status':rec_code,'post_negative_health_ms':round(rec_ms,2)}
          os.makedirs('evidence/arbm-control-senior-performance',exist_ok=True)
          with open('evidence/arbm-control-senior-performance/report.json','w') as f: json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY
      - name: Upload performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arbm-control-senior-performance-${{ github.run_id }}
          path: evidence/arbm-control-senior-performance
          if-no-files-found: error
          retention-days: 7
