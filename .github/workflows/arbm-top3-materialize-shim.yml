name: ARBM TOP3 Materialize Shim Patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbm-top3-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZERO_SPEND_MODE: HARD
      ARBM_ENABLE_LOCAL_VLM: '1'
      ARBM_VALIDATION_SPEND_MODE: zero
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: |
          set -euo pipefail
          make patch-shim-mesh
          python3 -m py_compile scripts/osworld_free_mesh_shim.py scripts/osworld_local_vlm.py scripts/patch_shim_mesh_top3.py
          python3 -m pip install --disable-pip-version-check -q -r scripts/requirements-osworld.txt
          python3 scripts/osworld_free_mesh_shim.py --test-isolated-run --run-id 35265789297 --task 091 --verify-budget --enforce-session-isolation
          python3 -m unittest scripts/test_osworld_groq_free.py scripts/test_osworld_groq_local_fallback.py scripts/test_osworld_failover_matrix.py -v

      - name: Commit only patched runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "chatgpt/arbm-top3-consolidated-20260917"
          git diff --check
          git diff --exit-code -- scripts/osworld_local_vlm.py
          git status --short
          git add scripts/osworld_free_mesh_shim.py
          if git diff --cached --quiet; then
            echo PATCH_ALREADY_MATERIALIZED
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "scripts/osworld_free_mesh_shim.py"
          git config user.name "arbm-top3-bot"
          git config user.email "295485177+arbmsistone-lab@users.noreply.github.com"
          git commit -m "fix: reserve local VLM budget and isolate shim sessions"
          git push origin HEAD:"$GITHUB_REF_NAME"
