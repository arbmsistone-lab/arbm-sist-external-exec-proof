name: ARBM Universal Remote

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation id
        required: true
        type: string
      mission_b64:
        description: Base64url mission payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  universal-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      MISSION_B64: ${{ inputs.mission_b64 }}
      ARBM_RUN_ROOT: ${{ github.workspace }}/.arbm-run
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate runner unit tests
        run: node scripts/universal-remote-runner.test.mjs

      - name: Execute universal mission
        id: execute
        run: node scripts/universal-remote-runner.mjs

      - name: Freeze evidence
        if: always()
        run: |
          mkdir -p "$ARBM_RUN_ROOT/evidence"
          printf '%s\n' "${{ inputs.request_id }}" > "$ARBM_RUN_ROOT/evidence/request-id.txt"
          sha256sum "$ARBM_RUN_ROOT/evidence"/* 2>/dev/null | sort > "$ARBM_RUN_ROOT/evidence/evidence-sha256.txt" || true

      - name: Upload universal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: universal-remote-${{ inputs.request_id }}
          path: ${{ env.ARBM_RUN_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 7

  lock-generator:
    if: ${{ inputs.request_id == 'arbm-aabbccddeeff0011' }}
    needs: universal-remote
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout lock branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/arbm-world-free-assurance-20260920
          fetch-depth: 0
          persist-credentials: true
      - name: Generate SHA256 dependency locks
        run: bash scripts/generate_hash_locks_temp.sh
      - name: Commit locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name armb-lock-bot
          git config user.email armb-lock-bot@users.noreply.github.com
          git add scripts/requirements-osworld.in scripts/requirements-osworld.txt audit/locks
          git diff --cached --quiet && exit 0
          git commit -m "security: generate SHA256-hashed Python dependency locks"
          git push origin HEAD:chatgpt/arbm-world-free-assurance-20260920
