name: DeepSWE Sovereign Sample 5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample5:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODEL_DIR: ${{ github.workspace }}/.cache/arbm-models
      MODEL_FILE: qwen2.5-coder-14b-instruct-q4_k_m.gguf
      MODEL_SHA256: c1e659736d89ac1065fb495330fb824d94001974a4bfa78e7270e43476a8d940
      LLAMA_TAG: b10516
      LLAMA_SHA256: f263a91280471b4c33c4999d7c76259c0f3a0a53a0b3e692b2c0b84380137a35
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Freeze DeepSWE and install Pier
        run: |
          set -euo pipefail
          git clone https://github.com/datacurve-ai/deep-swe.git deep-swe
          git -C deep-swe checkout 0b9fabbb63b9104d678fe965e1632f2dd9eaa2ea
          uv tool install datacurve-pier
          PIER_PY=$(head -n 1 "$(command -v pier)" | sed 's/^#!//')
          "$PIER_PY" - <<'PY'
from pathlib import Path
import pier.environments.agent_setup as m
p=Path(m.__file__)
s=p.read_text()
s=s.replace('"networks": ["pier-egress-internal", "default"],', '"networks": ["pier-egress-internal", "default"],\n                "extra_hosts": ["host.docker.internal:host-gateway"],', 1)
s=s.replace('acl Safe_ports port 80 443', 'acl Safe_ports port 80 443 8088', 1)
p.write_text(s)
PY
      - name: Restore sovereign model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}/${{ env.MODEL_FILE }}
          key: qwen25-coder-14b-q4km-${{ env.MODEL_SHA256 }}
          save-always: true
      - name: Prepare verified sovereign runtime
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          MODEL="$MODEL_DIR/$MODEL_FILE"
          if [ ! -f "$MODEL" ]; then curl -fL --retry 5 --retry-delay 5 -o "$MODEL" "https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/$MODEL_FILE?download=true"; fi
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          curl -fL --retry 4 -o /tmp/llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/llama-$LLAMA_TAG-bin-ubuntu-x64.tar.gz"
          echo "$LLAMA_SHA256  /tmp/llama.tgz" | sha256sum -c -
          mkdir -p /tmp/llama && tar -xzf /tmp/llama.tgz -C /tmp/llama
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server -print -quit)
          chmod +x "$LLAMA_SERVER"
          "$LLAMA_SERVER" -m "$MODEL" --host 0.0.0.0 --port 8088 -c 4096 -np 1 -t 4 -ctk q8_0 -ctv q8_0 --no-warmup --no-webui -a arbm-qwen-sovereign > sovereign.log 2>&1 &
          echo "ARBM_SOVEREIGN_SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8088/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8088/health
      - name: Verify Docker bridge can reach inference
        run: docker run --rm --add-host host.docker.internal:host-gateway curlimages/curl:8.15.0 -fsS http://host.docker.internal:8088/health
      - name: Run deterministic DeepSWE sample 5
        timeout-minutes: 140
        run: |
          set -euo pipefail
          pier run -p deep-swe/tasks --agent mini-swe-agent --model openai/arbm-qwen-sovereign --n-tasks 5 --sample-seed 0 --agent-kwarg 'model_class=litellm_textbased' --agent-kwarg 'config_file=.github/config/arbm-mini-textbased.yaml' --agent-kwarg 'extra_python_packages=["fastapi","orjson"]' --agent-env OPENAI_BASE_URL=http://host.docker.internal:8088/v1 --agent-env OPENAI_API_KEY=local-dummy-key | tee deepswe-sample5.log
      - name: Freeze sample evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p deepswe-sample5-evidence
          cp -f deepswe-sample5.log deepswe-sample5-evidence/ 2>/dev/null || true
          cp -f sovereign.log deepswe-sample5-evidence/ 2>/dev/null || true
          printf '%s\n' 'NON_SCORING_DETERMINISTIC_SAMPLE=true' > deepswe-sample5-evidence/metadata.txt
          printf '%s\n' 'SAMPLE_SIZE=5' >> deepswe-sample5-evidence/metadata.txt
          printf '%s\n' 'SAMPLE_SEED=0' >> deepswe-sample5-evidence/metadata.txt
          printf '%s\n' 'FULL_SCORE_REQUIRES_978_TRIALS=true' >> deepswe-sample5-evidence/metadata.txt
          find deepswe-sample5-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > deepswe-sample5-evidence/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepswe-sovereign-sample5
          path: deepswe-sample5-evidence
      - name: Stop sovereign runtime
        if: always()
        run: kill "$ARBM_SOVEREIGN_SERVER_PID" 2>/dev/null || true
