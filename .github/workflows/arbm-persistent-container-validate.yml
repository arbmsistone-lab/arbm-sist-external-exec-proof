name: ARBM Persistent Container Validate

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'cloud/back4app/**'
      - 'cloud/clawcloud/**'
      - 'scripts/persistent-continuity-agent.mjs'
      - 'scripts/persistent-container-health.mjs'
      - 'scripts/cloud-host-attestation*'
      - 'scripts/verify-persistent-container-policy.mjs'
      - '.github/workflows/arbm-persistent-container-validate.yml'

permissions:
  contents: read

concurrency:
  group: arbm-persistent-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Node syntax
        run: |
          node --check scripts/persistent-continuity-agent.mjs
          node --check scripts/persistent-container-health.mjs
          node --check scripts/cloud-host-attestation.mjs
      - name: Cloud attestation tests
        run: node scripts/cloud-host-attestation.test.mjs
      - name: Persistent container policy
        run: node scripts/verify-persistent-container-policy.mjs
      - name: Lease supervisor tests
        run: node scripts/continuity-execution-supervisor.test.mjs
      - name: Universal runner tests
        run: node scripts/universal-remote-runner.test.mjs
      - name: Benchmark contract
        run: |
          node -e "const fs=require('fs');for(const p of ['cloud/back4app/deployment-contract.json','cloud/clawcloud/deployment-contract.json'])JSON.parse(fs.readFileSync(p,'utf8'));"
      - name: Docker build
        run: docker build -t armb-continuity-persistent:test .
