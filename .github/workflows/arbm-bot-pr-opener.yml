name: ARBM Bot PR Opener
on:
  workflow_dispatch:
    inputs:
      head:
        required: true
        type: string
      base:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open bot-authored promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head }}
          BASE_BRANCH: ${{ inputs.base }}
        run: gh pr create --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "Promote OSWorld 061 bundle hardening" --body "Validated candidate SHA 6e91866b8bc688fbfff2828bf566b9a244168ab7. World-audit run 35248454038 SUCCESS. Human approval remains mandatory. ZERO_SPEND HARD and heavy_local=0 preserved. After merge, rerun world-audit on exact resulting SHA."