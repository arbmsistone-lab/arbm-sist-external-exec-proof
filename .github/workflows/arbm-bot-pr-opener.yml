name: ARBM Bot PR Opener
on:
  workflow_dispatch:
    inputs:
      head:
        required: true
        type: string
      base:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open bot-authored promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head }}
          BASE_BRANCH: ${{ inputs.base }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "Promote OSWorld 061 hardening (bot-authored)" --body "Bot-authored promotion PR for validated SHA fd3a86283e980633292ccc7d9f7d9a8a7dd43a24. Human approval remains mandatory. After merge, rerun OSWorld 061 world-audit on the exact resulting SHA. ZERO_SPEND HARD; heavy_local=0."