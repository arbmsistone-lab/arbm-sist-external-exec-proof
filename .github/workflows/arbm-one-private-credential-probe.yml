name: ARBM ONE Private Credential Probe

on:
  push:
    branches:
      - chatgpt/arbm-one-runner-0023aa3-20260920
    paths:
      - '.github/workflows/arbm-one-private-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      C1: ${{ secrets.ARBM_ONE_GITHUB_TOKEN }}
      C2: ${{ secrets.ARBM_GH_PAT }}
      C3: ${{ secrets.GITHUB_PAT }}
    steps:
      - name: Probe candidate private-repo credentials safely
        shell: bash
        run: |
          set -euo pipefail
          for var in C1 C2 C3; do
            val="${!var:-}"
            if [ -z "$val" ]; then
              echo "$var=PRESENT_FALSE"
              continue
            fi
            auth="$(printf 'x-access-token:%s' "$val" | base64 -w0)"
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H "Authorization: Basic $auth"               -H "Accept: application/vnd.github+json"               https://api.github.com/repos/arbmsistone-lab/ARBM-one || true)"
            echo "$var=REPO_HTTP_$code"
          done
