name: Core Fail-Closed Certification
on:
  push:
    branches: [codex/core-failclosed-final-20260908, codex/core-defense-depth-20260908, p8/constitution-source-context-20260905]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Execute evidence-driven core suite
        run: node core-failclosed-test-runner.mjs
      - name: Verify clean patch format
        run: git diff --check
      - name: Build core evidence certificate
        run: node core-failclosed-certificate.mjs
      - name: Freeze evidence hashes
        run: sha256sum evidence/core-failclosed/certificate.json | tee evidence/core-failclosed/SHA256SUMS.txt
      - name: Upload immutable core evidence
        uses: actions/upload-artifact@v6
        with:
          name: core-failclosed-certification
          path: evidence/core-failclosed/
          if-no-files-found: error
          retention-days: 90
