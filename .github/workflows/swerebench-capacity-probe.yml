name: SWE-rebench V2 Capacity Probe

on:
  push:
    branches:
      - chatgpt/arbm-world-free-assurance-20260920
    paths:
      - .github/workflows/swerebench-capacity-probe.yml
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SWE_REBENCH_COMMIT: c71902a8cf8d2b725f63d51f199f4d3e56f68d2d
      SWE_REBENCH_REPO: https://github.com/SWE-rebench/SWE-rebench-V2.git
      PRIMARY_ENDPOINT: https://pvkpkqwdnnpkgvllwqbc.supabase.co/functions/v1/arbm-benchmark-agent-v17
      FALLBACK_ENDPOINT: https://arbm-sist-p8-fallback.girolocal-rb.workers.dev
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Constitutional contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s audit/locks/datasets.txt
          mkdir -p evidence
          echo ZERO_SPEND_MODE=HARD
          echo EXECUTION_POLICY=REMOTE_ONLY
          echo LOCAL_HEAVY_ALLOWED=false
      - name: Fetch exact evaluator
        run: |
          set -euo pipefail
          git init swe-rebench-v2
          cd swe-rebench-v2
          git remote add origin "$SWE_REBENCH_REPO"
          git fetch --depth=1 origin "$SWE_REBENCH_COMMIT"
          git checkout --detach "$SWE_REBENCH_COMMIT"
          test "$(git rev-parse HEAD)" = "$SWE_REBENCH_COMMIT"

      - name: Install lightweight probe deps
        run: |
          python -m pip install --require-hashes --quiet -r audit/locks/datasets.txt

      - name: Probe public sample dataset
        run: |
          python - <<'PY'
          from datasets import load_dataset
          ds=load_dataset('ibragim-bad/SWE-rebench-V2-sample',split='train')
          print('DATASET_ROWS='+str(len(ds)))
          row=ds[0]
          print('INSTANCE_ID='+str(row.get('instance_id','')))
          print('REPO='+str(row.get('repo','')))
          PY
      - name: Acquire OIDC token
        id: oidc
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arbm-sist-benchmark" -o /tmp/arbm-oidc.json
          TOKEN=$(python -c 'import json; print(json.load(open("/tmp/arbm-oidc.json"))["value"])')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Probe zero-cost providers
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set +e
          mkdir -p evidence
          BODY='{"phase":"plan","issue":"public capacity probe only","repo_index":"TRACKED FILES:\nREADME.md","instance_id":"arbm-capacity-probe"}'
          for NAME in primary fallback; do
            if [ "$NAME" = primary ]; then URL="$PRIMARY_ENDPOINT"; else URL="$FALLBACK_ENDPOINT"; fi
            CODE=$(curl -sS --connect-timeout 10 --max-time 90 -o "evidence/$NAME-body.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$BODY" "$URL")
            echo "$CODE" > "evidence/$NAME-http.txt"
            echo "$NAME HTTP=$CODE"
          done
      - name: Freeze probe summary
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('evidence')
          root.mkdir(exist_ok=True)
          def read(name):
              p=root/name
              return p.read_text(errors='replace').strip() if p.exists() else ''
          primary=read('primary-http.txt')
          fallback=read('fallback-http.txt')
          out={'schema':'arbm-swerebench-capacity-probe-v1','benchmark':'SWE-rebench V2',
               'commit':'c71902a8cf8d2b725f63d51f199f4d3e56f68d2d','completeFamilyCertified':False,
               'sourceSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
               'primaryHttp':primary,'fallbackHttp':fallback,
               'httpTransportReady':primary=='200' and fallback=='200',
               'classification':'CAPACITY_PROBE_ONLY'}
          p=root/'swerebench-capacity-summary.json'
          p.write_text(json.dumps(out,indent=2))
          sums=[f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}'
                for f in sorted(root.iterdir()) if f.is_file() and f.name!='SHA256SUMS.txt']
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swerebench-capacity-${{ inputs.request_id || github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Require both HTTP probes without certifying benchmark performance
        run: |
          python - <<'PY'
          import json,sys
          summary=json.load(open('evidence/swerebench-capacity-summary.json'))
          if not summary['httpTransportReady']:
              print('PROVIDER_HTTP_GATE=FAIL')
              sys.exit(1)
          print('PROVIDER_HTTP_GATE=PASS; BENCHMARK_PERFORMANCE=NOT_CERTIFIED')
          PY
