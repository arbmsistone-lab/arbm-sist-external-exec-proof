name: ARBM ONE Private Source Proof V3

on:
  push:
    branches:
      - fix/arbm-one-cloud-bridge-push-20260921
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbm-one-private-source-proof-v3
  cancel-in-progress: true

jobs:
  exact-private-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: a293c83e5280c2812a519f0fccabf5a6dc02f0bf
      ARBM_CI_PROVIDER: github-external
      ARBM_CI_SCOPE: provider
      # Legacy ARBM_ONE_RUNNER_TOKEN path intentionally disabled after reproducible HTTP 401.
      # Private exact-SHA execution must use a short-lived identity broker; fail closed until configured.
    steps:
      - name: Require short-lived private-source identity broker
        shell: bash
        run: |
          set -euo pipefail
          echo "ARBM_PRIVATE_SOURCE_AUTH=BLOCKED_LEGACY_TOKEN_DISABLED" >&2
          echo "Static ARBM_ONE_RUNNER_TOKEN is prohibited after reproducible HTTP 401. Configure an approved short-lived GitHub App/OIDC broker before exact-SHA checkout." >&2
          exit 1


      - name: Prepare Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Assert exact source provenance
        shell: bash
        working-directory: arbm-one
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          echo "ARBM_EXACT_SOURCE=PASS sha=$TARGET_SHA"

      - name: Run portable provider gate
        shell: bash
        working-directory: arbm-one
        run: |
          set -euo pipefail
          npm run ci:portable:core

      - name: Run exact 12P and quorum contracts
        shell: bash
        working-directory: arbm-one
        run: |
          set -euo pipefail
          node --test tests/visual-12p-global-contract-v1.test.mjs tests/github-main-oidc-quorum-v1.test.mjs
          echo "ARBM_EXTERNAL_EXACT_PROVIDER_PROOF=PASS sha=$TARGET_SHA"
