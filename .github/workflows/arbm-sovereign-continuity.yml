name: ARBM Sovereign Continuity

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  sovereign-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate universal runner
        run: node scripts/universal-remote-runner.test.mjs
      - name: Request ARBM OIDC token
        id: oidc
        shell: bash
        run: |
          token="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arbm-continuity" | jq -r '.value')"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Heartbeat, claim and execute safe mission
        id: worker
        env:
          ARBM_OIDC: ${{ steps.oidc.outputs.token }}
          ARBM_RUN_ROOT: ${{ github.workspace }}/.arbm-run
        run: node scripts/sovereign-continuity-worker.mjs
      - name: Upload continuity evidence
        if: always() && steps.worker.outputs.claimed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-${{ steps.worker.outputs.mission_id }}-${{ github.run_id }}
          path: ${{ github.workspace }}/.arbm-run/evidence
          if-no-files-found: error
          retention-days: 7
