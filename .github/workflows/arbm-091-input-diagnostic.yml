name: ARBM 091 Input Diagnostic
on:
  push:
    branches:
      - chatgpt/arbm-091-input-diagnostic-20260918
    paths:
      - .github/workflows/arbm-091-input-diagnostic.yml
  workflow_dispatch: {}
permissions:
  contents: read
env:
  ZERO_SPEND_MODE: HARD
jobs:
  inspect-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify zero-spend public runner
        shell: bash
        run: |
          set -euo pipefail
          test "$ZERO_SPEND_MODE" = HARD
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Hydrate pinned task 091 inputs only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2026.08.08 https://github.com/xlang-ai/OSWorld-V2.git osworld
          test "$(git -C osworld rev-parse HEAD)" = d578d2d4e0dc82b43e270fdaa7fa89d9708cd154
          python -m pip install --disable-pip-version-check -q uv==0.8.15 huggingface_hub==0.35.3
          cd osworld
          uv sync --frozen
          uv run python scripts/tools/download_osworld_v2_tasks.py --benchmark-release osworld-v2-2026.08.08
          test -f evaluation_examples/task_class/task_091.py
          uv run python - <<'PY' > /tmp/osworld_asset_dirs.txt
          import os
          from huggingface_hub import HfApi
          files = HfApi(token=os.environ['HF_TOKEN']).list_repo_files(
              repo_id='xlangai/osworld_v2_assets_gated',
              repo_type='dataset',
              revision='v2026.08.08')
          print('\n'.join(sorted({x.split('/')[0] for x in files
                                  if x.startswith('task_091') and '/' in x})))
          PY
          test -s /tmp/osworld_asset_dirs.txt
          while IFS= read -r asset_dir; do
            uv run python scripts/tools/download_osworld_v2_assets.py \
              --benchmark-release osworld-v2-2026.08.08 \
              --allow-pattern "${asset_dir}/**" \
              --target-dir cache/osworld_v2_assets
          done < /tmp/osworld_asset_dirs.txt
          cd ..
      - name: Extract source-of-truth workbook and draft-deck manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python - <<'PY'
          from __future__ import annotations
          import json, re, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET

          ROOT = Path('osworld/cache/osworld_v2_assets')
          xlsx = next(ROOT.rglob('Reforecast_Model_H2.xlsx'))
          pptx = next(ROOT.rglob('Operating_Committee_Rebaseline_Draft.pptx'))

          NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          NS_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships'
          NS_PKG = 'http://schemas.openxmlformats.org/package/2006/relationships'
          NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main'
          NS_P = 'http://schemas.openxmlformats.org/presentationml/2006/main'

          def q(ns, tag):
              return '{%s}%s' % (ns, tag)

          def xlsx_manifest(path: Path):
              with zipfile.ZipFile(path) as z:
                  shared = []
                  if 'xl/sharedStrings.xml' in z.namelist():
                      root = ET.fromstring(z.read('xl/sharedStrings.xml'))
                      for si in root.findall(q(NS_MAIN, 'si')):
                          shared.append(''.join(t.text or '' for t in si.iter(q(NS_MAIN, 't'))))
                  wb = ET.fromstring(z.read('xl/workbook.xml'))
                  relroot = ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
                  rels = {r.attrib['Id']: r.attrib['Target'] for r in relroot.findall(q(NS_PKG, 'Relationship'))}
                  out = {}
                  for sh in wb.find(q(NS_MAIN, 'sheets')):
                      name = sh.attrib['name']
                      rid = sh.attrib[q(NS_REL, 'id')]
                      target = rels[rid]
                      xmlname = 'xl/' + target.lstrip('/')
                      root = ET.fromstring(z.read(xmlname))
                      rows = []
                      for c in root.iter(q(NS_MAIN, 'c')):
                          addr = c.attrib.get('r', '')
                          typ = c.attrib.get('t', '')
                          f = c.find(q(NS_MAIN, 'f'))
                          v = c.find(q(NS_MAIN, 'v'))
                          value = '' if v is None or v.text is None else v.text
                          if typ == 's' and value:
                              value = shared[int(value)]
                          elif typ == 'inlineStr':
                              value = ''.join(t.text or '' for t in c.iter(q(NS_MAIN, 't')))
                          elif typ == 'b' and value:
                              value = 'TRUE' if value == '1' else 'FALSE'
                          if value or f is not None:
                              rows.append({'cell': addr, 'value': value,
                                           'formula': None if f is None else (f.text or '')})
                      out[name] = rows
                  return out

          def slide_num(name: str):
              m = re.search(r'slide(\d+)\.xml$', name)
              return int(m.group(1)) if m else 10**9

          def pptx_manifest(path: Path):
              with zipfile.ZipFile(path) as z:
                  names = sorted((n for n in z.namelist()
                                  if re.fullmatch(r'ppt/slides/slide\d+\.xml', n)),
                                 key=slide_num)
                  slides = []
                  for name in names:
                      root = ET.fromstring(z.read(name))
                      all_text = [t.text or '' for t in root.iter(q(NS_A, 't'))]
                      shapes = []
                      for sp in root.iter(q(NS_P, 'sp')):
                          c = sp.find('.//' + q(NS_P, 'cNvPr'))
                          if c is None:
                              continue
                          texts = [t.text or '' for t in sp.iter(q(NS_A, 't'))]
                          if texts:
                              shapes.append({'id': c.attrib.get('id'),
                                             'name': c.attrib.get('name'),
                                             'text': ''.join(texts)})
                      slides.append({'slide': slide_num(name),
                                     'text': all_text,
                                     'shapes': shapes})
                  return slides

          report = {
              'status': 'TASK091_INPUT_MANIFEST',
              'zero_spend_mode': 'HARD',
              'evaluator_inspected': False,
              'workbook_path': str(xlsx.relative_to(ROOT)),
              'deck_path': str(pptx.relative_to(ROOT)),
              'workbook': xlsx_manifest(xlsx),
              'slides': pptx_manifest(pptx),
          }
          Path('diagnostic/task091-inputs.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({'sheets': list(report['workbook']),
                            'slides': len(report['slides']),
                            'evaluator_inspected': False,
                            'zero_spend_mode': 'HARD'}, sort_keys=True))
          PY
      - name: Upload input manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arbm091-input-manifest
          path: diagnostic/task091-inputs.json
          if-no-files-found: error
          retention-days: 30
