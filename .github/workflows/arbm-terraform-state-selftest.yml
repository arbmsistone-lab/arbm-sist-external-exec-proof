name: ARBM Terraform State Self-Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  state-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test private Terraform HTTP state backend
        run: node scripts/terraform-state-backend-selftest.mjs
