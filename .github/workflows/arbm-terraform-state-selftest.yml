name: ARBM Terraform State Self-Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test private Terraform HTTP state backend
        env:
          ARBM_TF_STATE_SECRET: ${{ secrets.ARBM_TF_STATE_SECRET }}
        run: node scripts/terraform-state-backend-selftest.mjs
