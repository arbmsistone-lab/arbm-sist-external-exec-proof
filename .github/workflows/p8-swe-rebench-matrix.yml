name: P8 SWE-rebench V2 evidence matrix
on:
  workflow_dispatch:
  push:
    branches:
      - p8/owner-20260904
    paths:
      - .p8-run-matrix
permissions:
  contents: read
  id-token: write
jobs:
  matrix-serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MODEL_DIR: ${{ github.workspace }}/.cache/arbm-models
      MODEL_FILE: qwen2.5-coder-14b-instruct-q4_k_m.gguf
      MODEL_SHA256: c1e659736d89ac1065fb495330fb824d94001974a4bfa78e7270e43476a8d940
      LLAMA_TAG: b10516
      LLAMA_SHA256: f263a91280471b4c33c4999d7c76259c0f3a0a53a0b3e692b2c0b84380137a35
    steps:
      - uses: actions/checkout@v7
      - name: Runner identity
        run: |
          uname -a
          free -m
          df -h .
          docker --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install datasets
      - name: Restore sovereign model cache once
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}/${{ env.MODEL_FILE }}
          key: qwen25-coder-14b-q4km-${{ env.MODEL_SHA256 }}
      - name: Prepare verified sovereign runtime once
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          MODEL="$MODEL_DIR/$MODEL_FILE"
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 5 --retry-delay 5 -o "$MODEL" "https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/$MODEL_FILE?download=true"
          fi
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          URL="https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/llama-$LLAMA_TAG-bin-ubuntu-x64.tar.gz"
          curl -fL --retry 4 -o /tmp/llama.tgz "$URL"
          echo "$LLAMA_SHA256  /tmp/llama.tgz" | sha256sum -c -
          mkdir -p /tmp/llama && tar -xzf /tmp/llama.tgz -C /tmp/llama
      - name: Start sovereign server once
        run: |
          set -euo pipefail
          LLAMA_SERVER=$(find /tmp/llama -type f -name llama-server -print -quit)
          test -n "$LLAMA_SERVER"
          chmod +x "$LLAMA_SERVER"
          "$LLAMA_SERVER" -m "$MODEL_DIR/$MODEL_FILE" --host 127.0.0.1 --port 8088 -c 2048 -np 1 -t 4 -ctk q8_0 -ctv q8_0 --no-warmup --no-webui -a arbm-qwen-sovereign > sovereign-matrix-server.log 2>&1 &
          echo "ARBM_SOVEREIGN_SERVER_PID=$!" >> "$GITHUB_ENV"
          echo "ARBM_SOVEREIGN_ENDPOINT=http://127.0.0.1:8088/v1/chat/completions" >> "$GITHUB_ENV"
          READY=0
          for i in $(seq 1 90); do if curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1; then READY=1; break; fi; sleep 2; done
          test "$READY" = 1
      - name: Generate frozen five-offset matrix
        env:
          ARBM_SOVEREIGN_ONLY: '1'
          MODEL_LABEL: ARBM-Sovereign-Qwen14B-v22
          MODEL_PROVIDER: github-public-runner-open-weight
          WORKER_REV: public-invariant-gated-sovereign-v22
        run: |
          set +e
          mkdir -p p8-matrix-artifacts
          FAILS=0
          for OFFSET in 1 2 3 4 5; do
            echo "=== GENERATE SWE offset $OFFSET ==="
            rm -rf p8-swe-artifact
            HF_OFFSET="$OFFSET" python p8-swe-rebench-smoke.py
            RC=$?
            mkdir -p "p8-matrix-artifacts/offset-$OFFSET"
            if [ -d p8-swe-artifact ]; then
              cp -a p8-swe-artifact/. "p8-matrix-artifacts/offset-$OFFSET/"
            fi
            echo "$RC" > "p8-matrix-artifacts/offset-$OFFSET/generation-exit-code.txt"
            if [ "$RC" -ne 0 ]; then FAILS=$((FAILS+1)); fi
          done
          echo "$FAILS" > p8-matrix-artifacts/generation-fail-count.txt
          exit 0
      - name: Stop sovereign server before evaluation
        if: always()
        run: |
          kill "$ARBM_SOVEREIGN_SERVER_PID" 2>/dev/null || true
          sleep 2
          tail -120 sovereign-matrix-server.log || true
      - name: Freeze generation hashes before evaluator
        if: always()
        run: |
          find p8-matrix-artifacts -type f ! -name GENERATION-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > p8-matrix-artifacts/GENERATION-SHA256SUMS.txt || true
          cat p8-matrix-artifacts/GENERATION-SHA256SUMS.txt || true
      - name: Generation evidence gate for all five offsets
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failures=[]
          for offset in (1,2,3,4,5):
              d=Path('p8-matrix-artifacts')/f'offset-{offset}'
              try:
                  ev=json.loads((d/'agent-evidence.json').read_text(encoding='utf-8'))
                  rc=int((d/'generation-exit-code.txt').read_text())
                  if rc != 0 or ev.get('validPatch') is not True or ev.get('exitCode') != 0 or ev.get('hfOffset') != offset:
                      failures.append(f'generation:{offset}')
              except Exception:
                  failures.append(f'generation_evidence:{offset}')
          print({'offsets':5,'failures':failures,'pass':not failures})
          if failures: raise SystemExit(45)
          PY
      - name: Checkout frozen evaluator after all generation
        run: |
          git clone https://github.com/SWE-rebench/SWE-rebench-V2.git swe-rebench-v2
          git -C swe-rebench-v2 checkout c71902a8cf8d2b725f63d51f199f4d3e56f68d2d
          python -m pip install -r swe-rebench-v2/requirements.txt
      - name: Evaluate generated offsets independently
        run: |
          set +e
          EVAL_FAILS=0
          for OFFSET in 1 2 3 4 5; do
            DIR="p8-matrix-artifacts/offset-$OFFSET"
            if [ ! -s "$DIR/patches.json" ]; then
              echo "missing patches for offset $OFFSET"
              EVAL_FAILS=$((EVAL_FAILS+1))
              continue
            fi
            python swe-rebench-v2/scripts/eval.py --hf-dataset ibragim-bad/SWE-rebench-V2-sample --hf-config default --hf-split train --hf-offset "$OFFSET" --hf-length 1 --patches "$DIR/patches.json" --max-workers 1 --report-json "$DIR/eval-report.json"
            RC=$?
            echo "$RC" > "$DIR/evaluator-exit-code.txt"
            if [ "$RC" -ne 0 ]; then EVAL_FAILS=$((EVAL_FAILS+1)); fi
          done
          echo "$EVAL_FAILS" > p8-matrix-artifacts/evaluator-fail-count.txt
          exit 0
      - name: Final matrix gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failures=[]
          root=Path('p8-matrix-artifacts')
          for offset in (1,2,3,4,5):
              d=root/f'offset-{offset}'
              try:
                  ev=json.load(open(d/'agent-evidence.json',encoding='utf-8'))
                  if not ev.get('validPatch') or int(ev.get('exitCode',1)) != 0:
                      failures.append(f'generation:{offset}')
              except Exception:
                  failures.append(f'generation_evidence:{offset}')
              try:
                  report=json.load(open(d/'eval-report.json',encoding='utf-8'))
                  if report.get('all_ok') is not True or int(report.get('total',0)) != 1:
                      failures.append(f'evaluator:{offset}')
              except Exception:
                  failures.append(f'evaluator_report:{offset}')
          print({'offsets':5,'failures':failures,'pass':not failures})
          if failures: raise SystemExit(46)
          PY
      - name: Freeze final evidence hashes
        if: always()
        run: |
          find p8-matrix-artifacts -type f ! -name FINAL-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > p8-matrix-artifacts/FINAL-SHA256SUMS.txt || true
          cat p8-matrix-artifacts/FINAL-SHA256SUMS.txt || true
      - name: Upload immutable matrix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p8-swe-rebench-v2-five-offset-matrix
          path: p8-matrix-artifacts
          retention-days: 90
