name: P3 Cloudflare OIDC FREE Proof
on:
  push:
    branches:
      - p3/cloudflare-free-dev-20260908
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove low-neuron Cloudflare routes via GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arbm-sist-benchmark"
          oidc="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | jq -r .value)"
          test -n "$oidc" && test "$oidc" != null
          for model in '@cf/meta/llama-3.2-1b-instruct' '@cf/ibm-granite/granite-4.0-h-micro'; do
            body="$(jq -nc --arg model "$model" '{model:$model}')"
            code="$(curl -sS -o response.json -w '%{http_code}' -H "Authorization: Bearer ${oidc}" -H 'content-type: application/json' --data "$body" https://arbm-capacity-proof-v2.zevanory.workers.dev)"
            echo "MODEL=$model HTTP_CODE=$code"
            test "$code" = 200
            jq -e --arg model "$model" '.ok == true and .provider == "cloudflare" and .model == $model and .mandatory_cost_usd == 0 and .paid_fallback_used == false and .response_nonempty == true' response.json >/dev/null
          done
      - name: Evidence marker
        run: echo 'ARBM_P3_CLOUDFLARE_LOW_NEURON_FREE=PASS'