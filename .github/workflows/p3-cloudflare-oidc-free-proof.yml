name: P3 Cloudflare OIDC FREE Proof
on:
  push:
    branches: [p3/cloudflare-free-dev-20260908]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove low-neuron routes and enforced Granite lane
        shell: bash
        run: |
          set -euo pipefail
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arbm-sist-benchmark"
          oidc="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url" | jq -r .value)"
          test -n "$oidc" && test "$oidc" != null
          endpoint='https://arbm-capacity-proof-v2.zevanory.workers.dev'
          for model in '@cf/meta/llama-3.2-1b-instruct' '@cf/ibm-granite/granite-4.0-h-micro'; do
            body="$(jq -nc --arg model "$model" '{model:$model}')"
            code="$(curl -sS -o response.json -w '%{http_code}' -H "Authorization: Bearer ${oidc}" -H 'content-type: application/json' --data "$body" "$endpoint")"
            test "$code" = 200
            jq -e --arg model "$model" '.ok and .model==$model and .mandatory_cost_usd==0 and .paid_fallback_used==false and .response_nonempty' response.json >/dev/null
          done
          python - <<'PY'
          text=('ARBM SIST capacity lane processes cloud-hosted operational context, evidence, constraints, audit state, routing policy, rollback state and verification requirements before returning a concise bounded decision. ' * 180)
          open('prompt.txt','w',encoding='utf-8').write(text)
          PY
          body="$(jq -nc --rawfile prompt prompt.txt '{mode:"capacity_lane",prompt:$prompt,max_output_tokens:128}')"
          code="$(curl -sS -o lane.json -w '%{http_code}' -H "Authorization: Bearer ${oidc}" -H 'content-type: application/json' --data "$body" "$endpoint")"
          echo "LANE_HTTP=$code"
          jq '{ok,error,model,mode,preflight_usage,main_usage,max_output_tokens,max_allowed_output_tokens}' lane.json
          test "$code" = 200
          jq -e '.ok and .model=="@cf/ibm-granite/granite-4.0-h-micro" and .mode=="GRANITE_RATIO_20" and .preflight_usage.prompt_tokens>=1024 and .main_usage.prompt_tokens==.preflight_usage.prompt_tokens and .main_usage.completion_tokens<=.max_output_tokens and .max_output_tokens<=.max_allowed_output_tokens and .ratio_denominator==5 and .mandatory_cost_usd==0 and .paid_fallback_used==false' lane.json >/dev/null
          short='{"mode":"capacity_lane","prompt":"short prompt","max_output_tokens":1}'
          test "$(curl -sS -o neg-short.json -w '%{http_code}' -H "Authorization: Bearer ${oidc}" -H 'content-type: application/json' --data "$short" "$endpoint")" = 422
          jq -e '.error=="prompt_too_short"' neg-short.json >/dev/null
          body="$(jq -nc --rawfile prompt prompt.txt '{mode:"capacity_lane",prompt:$prompt,max_output_tokens:512}')"
          test "$(curl -sS -o neg-ratio.json -w '%{http_code}' -H "Authorization: Bearer ${oidc}" -H 'content-type: application/json' --data "$body" "$endpoint")" = 422
          jq -e '.error=="output_ratio_exceeded"' neg-ratio.json >/dev/null
          echo 'ARBM_P3_CLOUDFLARE_GRANITE_RATIO_LANE=PASS'
