        assert parent_changed == [workflow_path]
        print('AUTHORIZED_GUEST_TASK_ID_PROPAGATION_GATE=PASS')
        PY
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" HEAD^^
