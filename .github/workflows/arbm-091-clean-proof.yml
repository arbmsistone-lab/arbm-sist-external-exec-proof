name: ARBM 091 Clean Transplant Proof
run-name: ARBM 091 clean proof ${{ github.sha }}
'on':
  push:
    branches:
    - chatgpt/arbm-091-clean-rebuild-20260922
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
  id-token: write
concurrency:
  group: arbm091-clean-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
  ZERO_SPEND_MODE: HARD
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ZERO_SPEND_MODE: HARD
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install pinned test dependencies
      run: python -m pip install -r scripts/requirements-osworld.txt
    - name: Run complete OSWorld regression suite
      run: python -m unittest discover -s scripts -p 'test_osworld_*.py'
    - name: Run v32 deterministic regression gate
      run: python scripts/osworld_v32_regression_gate.py
    - name: Download run30 recorded evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 34665245131 --repo arbmsistone-lab/arbm-sist-external-exec-proof --dir run30
    - name: Download run38 recorded evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download 34698877150 --repo arbmsistone-lab/arbm-sist-external-exec-proof --name top3-osworld-task-bundle
        --dir run38
    - name: Replay historical v31 evidence through v32 policy
      run: python scripts/osworld_v32_historical_gate.py run30 run38
    - name: Prove zero-spend policy gate
      run: test "$ZERO_SPEND_MODE" = "HARD"
    permissions:
      actions: read
      contents: read
  proof-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned lightweight dependencies
      run: |
        python -m pip install -r scripts/requirements-osworld.txt
        python -m pip install PyYAML==6.0.2
    - name: Verify clean history and exact changed-file scope
      shell: bash
      run: |
        set -euo pipefail
        AUTHORIZED_PARENT='3b29fa943330937e4352c0c9cca5700cba261624'
        AUTHORIZED_MESSAGE='test(091): migrate historical observed-canvas replay fixtures'
        current_parent="$(git rev-parse HEAD^)"
        current_message="$(git log -1 --format=%s)"
        if [[ "$current_parent" == "$AUTHORIZED_PARENT" && "$current_message" == "$AUTHORIZED_MESSAGE" ]]; then
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD)"
          [[ "$changed" == '.github/workflows/arbm-091-clean-proof.yml' ]]
          python - <<'PY'
        from pathlib import Path
        import subprocess

        path='.github/workflows/arbm-091-clean-proof.yml'
        current=Path(path).read_text()
        parent=subprocess.check_output(['git','show','HEAD^:'+path], text=True)

        observed=(
            ('Replay run 35404537401 AT-SPI-empty deck regression',
             "owner_evidence={'window_id':44040210,'pid':2607,'wm_class':'wpsoffice wpsoffice'}"),
            ('Replay run 35407234122 canonical pointer policy regression',
             "owner_evidence={'window_id':44040207,'pid':2591,'wm_class':'wpsoffice wpsoffice'}"),
            ('Replay run 35444915125 exact-shape targeting regression',
             "owner_evidence={'window_id':44040210,'pid':2750,'wm_class':'wpsoffice wpsoffice'}"),
            ('Replay run 35448424940 repair-geometry reprojection regression',
             "owner_evidence={'window_id':12582930,'pid':3019,'wm_class':'wpsoffice wpsoffice'}"),
        )
        non_canvas=(
            'Replay exact WPS 2019 Step 2 through alias-isolated selector twice',
            'Replay run 35391431490 System Check modal regression',
            'Replay run 35400883826 Enter regression',
            'Replay run 35411705196 non-restricted corruption rejection',
            'Replay run 35439821335 delete-only repair regression',
            'Replay run 35443356294 restricted repair regression',
        )

        def block(text,name):
            token='    - name: '+name
            start=text.index(token)
            end=text.find('\n    - name:',start+len(token))
            return text[start:] if end < 0 else text[start:end]

        for name in non_canvas:
            assert block(current,name) == block(parent,name), name

        for name,owner in observed:
            b=block(current,name)
            assert 'from arbm091.test_fixture_state import observed_task091_state' in b, name
            assert 'slide_canvas_bbox=[443,194,1227,690]' in b, name
            assert owner in b, name
            assert "frame_identity={'active_slide':1}" in b, name
            assert "window_bbox=[70,27,1850,1053]" in b, name
            assert "screen=[0,0,1920,1080]" in b, name
        print('AUTHORIZED_REPLAY_CANVAS_SCOPE_GATE=PASS')
        PY
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$AUTHORIZED_PARENT"
          (
            cd "$tmp"
            python -m arbm091.verify_transplant
          )
          git worktree remove -f "$tmp"
        elif [[ "$current_parent" == '07791bdbc1b3af45a6f1a24f2aacf663c6eea0d0' && "$current_message" == 'fix(091): propagate task identity to guest probe' ]]; then
          [[ "$(git rev-parse HEAD^^)" == '3b29fa943330937e4352c0c9cca5700cba261624' ]]
          [[ "$(git log -1 --format=%s HEAD^)" == 'test(091): migrate historical observed-canvas replay fixtures' ]]
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD | LC_ALL=C sort)
          [[ "${#changed[@]}" -eq 2 ]]
          [[ "${changed[0]}" == '.github/workflows/arbm-091-clean-proof.yml' ]]
          [[ "${changed[1]}" == 'scripts/arbm091/wps_observer.py' ]]
          python - <<'PY'
