      OSWORLD_EVAL_MODEL_NAME: nex-agi/nex-n2.5-pro:free
      OSWORLD_EVAL_MODEL_BASE_URL: http://127.0.0.1:8089/v1
      OSWORLD_EVAL_MODEL_API_KEY_ENV: OPENAI_API_KEY
