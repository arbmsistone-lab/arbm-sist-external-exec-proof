        current_observer=Path(observer_path).read_text()
        parent_observer=subprocess.check_output(['git','show','HEAD^:'+observer_path], text=True)

        def step(text,name):
            token='    - name: '+name
            start=text.index(token)
            end=text.find('\n    - name:',start+len(token))
            return text[start:] if end < 0 else text[start:end]

        gate_name='Verify clean history and exact changed-file scope'
        current_gate=step(current_workflow,gate_name)
        parent_gate=step(parent_workflow,gate_name)
        assert current_workflow.replace(current_gate,parent_gate,1) == parent_workflow

        old_line="    code = 'POINT = ' + repr(point) + '\\n' + _PROBE"
        new_line="    code = \"import os\\nos.environ['TASK_ID'] = '091'\\nPOINT = \" + repr(point) + '\\n' + _PROBE"
        assert parent_observer.count(old_line) == 1
        assert current_observer.count(new_line) == 1
        assert current_observer == parent_observer.replace(old_line,new_line,1)

        parent_changed=subprocess.check_output(
