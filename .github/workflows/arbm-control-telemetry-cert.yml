name: ARBM CONTROL Telemetry External Certification

on:
  push:
    branches:
      - feat/arbm-control-telemetry-cert-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cert branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify exact mirrored blob SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object proof/arbm-control/worker-senior.js)" = "b7800888d4db27f2308bc219c8312a15ab328218"
      - name: Syntax validation
        run: node --check proof/arbm-control/worker-senior.js
      - name: Security and governance invariants
        shell: bash
        run: |
          set -euo pipefail
          f=proof/arbm-control/worker-senior.js
          grep -q "schema: 'arbm-control-telemetry/v1'" "$f"
          grep -q "zero_spend: true" "$f"
          grep -q "fail_closed: true" "$f"
          grep -q "destructive_actions: false" "$f"
          grep -q "no-store, private" "$f"
          grep -q "ARBM_TELEMETRY_TOKEN" "$f"
          grep -q "unauthorized" "$f"
          ! grep -E "console.*GITHUB_TOKEN|console.*ARBM_CONTROL_TOKEN|console.*ARBM_TELEMETRY_TOKEN" "$f"
          ! grep -E "delete|force-push|reset --hard|rm -rf" "$f"
      - name: Evidence coverage invariants
        shell: bash
        run: |
          set -euo pipefail
          f=proof/arbm-control/worker-senior.js
          grep -q "external_ci" "$f"
          grep -q "e2e" "$f"
          grep -q "recovery" "$f"
          grep -q "production" "$f"
          grep -q "check-runs" "$f"
          grep -q "actions/runs" "$f"
      - name: Freeze certification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/arbm-control-telemetry
          sha256sum proof/arbm-control/worker-senior.js > evidence/arbm-control-telemetry/sha256.txt
          git hash-object proof/arbm-control/worker-senior.js > evidence/arbm-control-telemetry/git-blob-sha.txt
          printf '%s\n' 'source_repo=arbmsistone-lab/arbm-control' > evidence/arbm-control-telemetry/source.txt
          printf '%s\n' 'source_branch=feat/senior-private-telemetry-20260917' >> evidence/arbm-control-telemetry/source.txt
          printf '%s\n' 'source_commit=61d221294cf902cc393ac8136d8e4a9524249f75' >> evidence/arbm-control-telemetry/source.txt
          printf '%s\n' 'source_blob=b7800888d4db27f2308bc219c8312a15ab328218' >> evidence/arbm-control-telemetry/source.txt
      - name: Upload certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ar-control-telemetry-cert-${{ github.run_id }}
          path: evidence/arbm-control-telemetry
          if-no-files-found: error
          retention-days: 7
