name: TASK-091 scope fix once
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair exact regression method
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/arbm091/test_semantic_runtime.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    def test_summaryarr_geometry_repair_accepts_split_ooxml_text_runs(self):')
          end=s.index('\n    def test_fixed_width_second_click_still_requires_caret_proof(self):',start)
          replacement=(
              "    def test_summaryarr_geometry_repair_accepts_split_ooxml_text_runs(self):\n"
              "        import ast\n"
              "        source=Path(\"scripts/arbm091/wps_observer.py\").read_text(encoding=\"utf-8\")\n"
              "        tree=ast.parse(source)\n"
              "        fn=next(\n"
              "            node for node in tree.body\n"
              "            if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))\n"
              "            and node.name==\"_guest_summaryarr_geometry_repair\"\n"
              "        )\n"
              "        lines=source.splitlines()\n"
              "        repair=\"\\n\".join(lines[fn.lineno-1:fn.end_lineno])\n"
              "        self.assertIn(\"shape_text=b''.join(re.findall(br'<a:t>(.*?)</a:t>',shape,flags=re.S)).decode('utf-8')\",repair)\n"
              "        self.assertIn(\"verify_text=b''.join(re.findall(br'<a:t>(.*?)</a:t>',seg,flags=re.S)).decode('utf-8')\",repair)\n"
              "        self.assertNotIn(\"shape.count(expected_text.encode())!=1\",repair)\n"
              "        self.assertNotIn(\"out.count(expected_text.encode())!=1\",repair)\n"
          )
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          PY
          python -m py_compile tests/arbm091/test_semantic_runtime.py
          git diff --check -- tests/arbm091/test_semantic_runtime.py
      - name: Commit exact test-only result
        shell: bash
        run: |
          rm .github/workflows/task091-scope-fix-once.yml
          git config user.name 'arbmsistone-lab'
          git config user.email 'arbmsistone@gmail.com'
          git add tests/arbm091/test_semantic_runtime.py .github/workflows/task091-scope-fix-once.yml
          git diff --cached --check
          git commit -m 'test(091): fix scoped SummaryArr regression assertion'
          git push origin HEAD:chatgpt/arbm-091-two-phase-reprojection-20260929
