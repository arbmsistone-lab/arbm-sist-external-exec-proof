name: TASK-091 one-shot scope fix
on:
  push:
    branches:
      - chatgpt/arbm-091-two-phase-reprojection-20260929
permissions:
  contents: write
jobs:
  patch-test-scope:
    if: github.event.head_commit.message == 'chore(091): stage one-shot scoped regression test fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only SummaryArr regression test scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/arbm091/test_semantic_runtime.py')
          s=p.read_text(encoding='utf-8')
          old='''    def test_summaryarr_geometry_repair_accepts_split_ooxml_text_runs(self):
              source=Path("scripts/arbm091/wps_observer.py").read_text(encoding="utf-8")
              self.assertIn("shape_text=b''.join(re.findall(br'<a:t>(.*?)</a:t>',shape,flags=re.S)).decode('utf-8')",source)
              self.assertIn("verify_text=b''.join(re.findall(br'<a:t>(.*?)</a:t>',seg,flags=re.S)).decode('utf-8')",source)
              self.assertNotIn("shape.count(expected_text.encode())!=1",source)
              self.assertNotIn("out.count(expected_text.encode())!=1",source)
          '''
          new='''    def test_summaryarr_geometry_repair_accepts_split_ooxml_text_runs(self):
              import ast
              source=Path("scripts/arbm091/wps_observer.py").read_text(encoding="utf-8")
              tree=ast.parse(source)
              fn=next(
                  node for node in tree.body
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef))
                  and node.name=="_guest_summaryarr_geometry_repair"
              )
              lines=source.splitlines()
              repair="\\n".join(lines[fn.lineno-1:fn.end_lineno])
              self.assertIn("shape_text=b''.join(re.findall(br'<a:t>(.*?)</a:t>',shape,flags=re.S)).decode('utf-8')",repair)
              self.assertIn("verify_text=b''.join(re.findall(br'<a:t>(.*?)</a:t>',seg,flags=re.S)).decode('utf-8')",repair)
              self.assertNotIn("shape.count(expected_text.encode())!=1",repair)
              self.assertNotIn("out.count(expected_text.encode())!=1",repair)
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected exact target block once, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check -- tests/arbm091/test_semantic_runtime.py
          git diff -- tests/arbm091/test_semantic_runtime.py
      - name: Run target regression test
        run: python -m unittest tests.arbm091.test_semantic_runtime.SemanticRuntimeTests.test_summaryarr_geometry_repair_accepts_split_ooxml_text_runs
      - name: Run all ARBM-091 proof tests
        run: python -m unittest discover -s tests/arbm091 -p 'test_*.py'
      - name: Commit scoped fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/task091-scope-fix-once.yml
          git config user.name 'arbmsistone-lab'
          git config user.email 'arbmsistone@gmail.com'
          git add tests/arbm091/test_semantic_runtime.py .github/workflows/task091-scope-fix-once.yml
          git diff --cached --check
          git commit -m 'test(091): scope SummaryArr OOXML assertions to repair function'
          git push origin HEAD:chatgpt/arbm-091-two-phase-reprojection-20260929
