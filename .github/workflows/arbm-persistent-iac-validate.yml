name: ARBM Persistent IaC Validate

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/persistent/**'
      - 'cloud/common/**'
      - 'cloud/oci/**'
      - 'scripts/cloud-host-attestation*'
      - 'scripts/verify-persistent-iac.mjs'

permissions:
  contents: read

concurrency:
  group: armb-persistent-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Policy gate
        run: node scripts/verify-persistent-iac.mjs
      - name: Bootstrap syntax
        run: bash -n cloud/common/bootstrap-persistent-host.sh cloud/oci/bootstrap-persistent-host.sh
      - name: Terraform format
        run: terraform -chdir=infra/persistent/oci fmt -check
      - name: Terraform init without backend
        run: terraform -chdir=infra/persistent/oci init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/persistent/oci validate
      - name: Assert validation-only workflow
        shell: bash
        run: |
          if grep -R -nE 'terraform[[:space:]]+apply' .github/workflows/arbm-persistent-iac-validate.yml; then
            echo 'terraform_apply_forbidden_in_validation_workflow' >&2
            exit 1
          fi
