name: P3 External Security Audit
on:
  push:
    branches: ['p3/security-audit-20260908']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          category: '/language:${{ matrix.language }}'
  gate:
    name: High Critical Gate
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Query CodeQL alerts and fail closed
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/heads/${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${ref}&state=open&per_page=100" > alerts.json
          critical="$(jq '[.[]|select((.rule.security_severity_level // "") == "critical")]|length' alerts.json)"
          high="$(jq '[.[]|select((.rule.security_severity_level // "") == "high")]|length' alerts.json)"
          total="$(jq 'length' alerts.json)"
          printf '{"schema":"arbm-p3-codeql-gate-v1","sha":"%s","openTotal":%s,"openCritical":%s,"openHigh":%s,"pass":%s}\n' "$GITHUB_SHA" "$total" "$critical" "$high" "$([ "$critical" -eq 0 ] && [ "$high" -eq 0 ] && echo true || echo false)" > p3-codeql-gate.json
          cat p3-codeql-gate.json
          test "$critical" -eq 0
          test "$high" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-codeql-gate-evidence
          path: p3-codeql-gate.json
