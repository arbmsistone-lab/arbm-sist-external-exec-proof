build:
  system: docker
  min_cpu: 0.25
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"

scaling:
  trigger: http_requests
  min_cpu: 0.25
  max_cpu: 0.25
  min_memory: 256
  max_memory: 256
  min_replicas: 1
  max_replicas: 1

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 60
